<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up AgentDuet</title>
<style>
  :root{
    --ink:#101418; --paper:#f6f7f8; --surface:#fff; --line:#e2e6ea; --line2:#eef1f4;
    --muted:#5b6675; --faint:#8b96a3;
    --accent:#00b2ff; --accent-ink:#0077b0; --coral:#f0523d;
    --good:#1a7f5a; --good-bg:#e8f5ef; --bad:#b3261e; --bad-bg:#fff1ee;
    --sans:"SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{--ink:#eef3f7;--paper:#0f1419;--surface:#161d24;--line:#242e38;--line2:#1c242c;
      --muted:#93a6b5;--faint:#6b7c8a;--accent-ink:#4cc7ff;--good:#4ade9e;--good-bg:#13322a;--bad:#ffb4a8;--bad-bg:#2a1512;}
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.5;}
  .wrap{max-width:44rem;margin:0 auto;padding:2.4rem 1.3rem 5rem;}
  h1{font-size:1.6rem;font-weight:780;letter-spacing:-.02em;}
  .lede{color:var(--muted);margin-top:.5rem;}

  .steps{display:flex;gap:.4rem;margin:1.7rem 0 1.7rem;font-family:var(--mono);font-size:.62rem;
    letter-spacing:.1em;text-transform:uppercase;}
  .steps div{flex:1;padding:.35rem .2rem .45rem;text-align:center;color:var(--faint);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
    border-bottom:2px solid var(--line);transition:color .12s,border-color .12s;}
  .steps div:hover{color:var(--muted);}
  .steps div.on{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:700;}
  .steps div.done{color:var(--good);border-bottom-color:var(--good);}

  section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:1.4rem 1.4rem 1.5rem;display:none;}
  section.card.on{display:block;}
  h2{font-size:1.24rem;font-weight:760;letter-spacing:-.01em;}
  .hint{color:var(--muted);font-size:.9rem;margin-top:.4rem;}
  label{display:block;margin-top:1.1rem;font-size:.88rem;font-weight:650;}
  label .sm{display:block;font-weight:400;color:var(--muted);font-size:.83rem;margin-top:.15rem;}
  input,textarea,select{width:100%;font:inherit;font-size:.94rem;margin-top:.4rem;
    padding:.55rem .7rem;border:1px solid var(--line);border-radius:9px;
    background:var(--paper);color:var(--ink);}
  textarea{min-height:4.5rem;resize:vertical;}
  .row{display:flex;gap:.6rem;align-items:flex-end;}
  .row > *{flex:1;}
  button{font:inherit;font-size:.92rem;font-weight:700;padding:.6rem 1.15rem;border:0;
    border-radius:10px;background:var(--accent-ink);color:#fff;cursor:pointer;}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  button:disabled{opacity:.45;cursor:default;}
  .acts{display:flex;gap:.6rem;align-items:center;margin-top:1.5rem;}
  .acts .sp{flex:1;}
  .state{margin-top:.9rem;padding:.75rem .9rem;border-radius:10px;background:var(--line2);
    color:var(--muted);font-size:.88rem;line-height:1.55;}
  .state code{font-family:var(--mono);font-size:.8rem;color:var(--ink);word-break:break-all;}
  .state .note{display:block;margin-top:.35rem;color:var(--faint);font-size:.82rem;}

  .pick{display:block;margin-top:.7rem;padding:.8rem .9rem;border:1px solid var(--line);
    border-radius:11px;font-weight:400;font-size:.92rem;cursor:pointer;
    transition:border-color .12s,background .12s;}
  .pick:hover{border-color:var(--faint);}
  .pick:has(input:checked){border-color:var(--accent-ink);background:var(--line2);}
  .pick input{width:auto;margin:0 .5rem 0 0;accent-color:var(--accent-ink);}
  .pick b{font-weight:680;}
  .pick .sm{display:block;margin:.3rem 0 0 1.45rem;color:var(--faint);font-size:.82rem;}

  .msg{margin-top:1rem;padding:.7rem .85rem;border-radius:10px;font-size:.9rem;
    white-space:pre-wrap;}
  .msg.ok{background:var(--good-bg);color:var(--good);border:1px solid var(--good);}
  .msg.no{background:var(--bad-bg);color:var(--bad);border:1px solid var(--coral);}
  a{color:var(--accent-ink);}

                      .spin{font-family:var(--mono);font-size:.8rem;color:var(--faint);}
</style>
<style>
  /* SIGN-IN is the first thing anyone sees, so the three providers are the page, not a row of
     controls. Full width, stacked, equal weight — we do not know which one an owner has. */
  .sso{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;
    margin-top:.6rem;padding:.75rem 1rem;background:var(--surface);color:var(--ink);
    border:1px solid var(--line);font-weight:650;}
  .sso:hover{border-color:var(--faint);}
  .sso .g{font-family:var(--mono);font-size:.78rem;color:var(--faint);font-weight:400;}

  /* THE CHEAT BLOCK. Visually separated because it is scaffolding, not product: everything in
     here disappears the day sign-on works. Kept collapsed so it does not read as the main path.
  */
  details.dev{margin-top:1.6rem;border:1px dashed var(--line);border-radius:12px;
    padding:.9rem 1rem;background:var(--line2);}
  details.dev summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted);}
  details.dev .hint{font-size:.85rem;}
  .fieldset{margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--line);}
  .fieldset:first-of-type{border-top:0;padding-top:0;}

  .foot{margin-top:1.6rem;text-align:center;font-family:var(--mono);font-size:.68rem;
    letter-spacing:.06em;color:var(--faint);}
  .num{margin-top:.4rem;font-family:var(--mono);font-size:1.05rem;color:var(--ink);}
  .quit{margin-top:1.6rem;text-align:center;font-size:.82rem;color:var(--faint);}
  .quit a{color:var(--faint);text-decoration:underline;}
  .wrap{max-width:30rem;}          /* an app window, not a document */
</style>

</head>
<body>
<div class="wrap">

  <section class="card on" id="c1">
    <h1>Welcome to AgentDuet</h1>
    <p class="lede">On-device AI engine for your Power Mobile service. Please sign in to link
      your desktop AI hub.</p>

    <button class="sso" data-p="Apple">Continue with Apple</button>
    <button class="sso" data-p="Google">Continue with Google</button>
    <button class="sso" data-p="Microsoft">Continue with Microsoft</button>
    <div id="mSso"></div>

    <p class="foot">B3Networks Power Mobile AI Protocol • v1.0</p>
  </section>

  <section class="card" id="c2">
    <h1>Quick Application Setup</h1>
    <p class="lede">Select where recordings &amp; logs will be stored.</p>

    <label>Data Storage Folder</label>
    <div class="row">
      <input id="folder" readonly>
      <button class="ghost" id="doBrowse" style="flex:0 0 auto">Browse</button>
    </div>

    <label style="margin-top:1.4rem">Power Mobile</label>
    <div class="num" id="num">—</div>

    <div class="acts">
      <button id="doDone">Complete Setup &amp; Open Hub &nbsp;→</button>
      <span class="spin" id="spDone"></span>
    </div>
    <div id="mDone"></div>
  </section>

  <!-- A WAY OUT. Not in the design, kept because closing the tab leaves the daemon running with
       nothing on screen to say so, and the url carries a per-machine token — a closed tab is a
       lost tab. Deliberately the quietest thing on the page. -->
  <p class="quit"><a href="#" id="doCancel">Quit</a> <span id="cancelWhat"></span></p>
  <div id="mCancel"></div>
</div>

<script>
  window.onerror = function (m, src, line, col) {
    try { new Image().src = '/__jserr?m=' + encodeURIComponent(m) + '&line=' + line; } catch (e) {}
  };

  const T = new URLSearchParams(location.search).get('t') || '';
  const $ = id => document.getElementById(id);
  const esc = s => (s || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

  function show(n){
    [1, 2].forEach(i => $('c' + i).classList.toggle('on', i === n));
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
  function say(el, ok, text){
    $(el).innerHTML = `<div class="msg ${ok ? 'ok' : 'no'}">${esc(text)}</div>`;
  }
  async function post(path, body){
    const r = await fetch(`${path}?t=${T}`, {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    return r.json();
  }

  // ---- sign in (stubbed) -------------------------------------------------------------------
  // Everything sign-on will supply — connector, name, number — is configured in Settings, which
  // is one screen inside the hub. Setup does NOT carry a copy of those fields: two places to
  // type a connector is two places for it to be half-typed.
  let OAUTH = false;
  document.querySelectorAll('.sso').forEach(b => {
    b.onclick = () => {
      const who = b.dataset.p;
      if (OAUTH) { location.href = `/api/connector/signin?t=${T}&provider=` + encodeURIComponent(who); return; }
      say('mSso', false, `Signing in with ${who} is not connected yet. `
        + 'Continue, then finish in Settings.');
      show(2);
    };
  });

  async function load(){
    const d = await fetch(`/api/setup/current?t=${T}`).then(r => r.json()).catch(() => ({}));
    OAUTH = !!d.oauth_available;
    $('folder').value = d.carried_dir || '';
    $('num').textContent = d.phone || '—';
  }
  load();

  // Choosing the folder needs a native picker this page does not have, and carry.RECORDINGS is
  // a module constant besides. It says so rather than opening nothing.
  $('doBrowse').onclick = () => say('mDone', false,
    'Choosing the folder is not built yet. It is set by AGENTDUET_HOME.');

  $('doDone').onclick = async () => {
    $('doDone').disabled = true; $('spDone').textContent = 'finishing…';
    const d = await post('/api/handover', {});
    $('spDone').textContent = '';
    $('doDone').disabled = false;
    if (d.ok) { location.href = '/?t=' + T; return; }
    say('mDone', false, d.message);
  };

  // The same page is reachable on a CONFIGURED instance, where this process IS the daemon and
  // stopping it takes it off the air. Read the channel and say which — a static "nothing is
  // running yet" is a lie exactly when the consequence matters.
  let onAir = false;
  fetch(`/api/state?t=${T}`).then(r => r.json()).then(st => {
    const c = (st && st.channel) || {};
    onAir = ['live', 'connecting', 'retrying'].indexOf(c.channel) >= 0;
    $('cancelWhat').textContent = onAir
      ? '— this machine is on the air.' : '';
  }).catch(() => {});

  $('doCancel').onclick = async (e) => {
    e.preventDefault();
    const warn = onAir ? 'Stop it? Calls stop arriving until you start it again.'
                       : 'Stop setup? Nothing is arriving yet.';
    if (!confirm(warn + '\n\nWhat you saved stays saved.')) return;
    try { await post('/api/quit', {}); } catch (e2) {}
    document.body.innerHTML =
      '<div style="font-family:var(--mono);font-size:.9rem;padding:2.5rem;color:var(--muted);'
      + 'max-width:44rem;line-height:1.7">Stopped.<br><br>'
      + (onAir ? 'Nothing reaches this machine until you start it again.<br><br>'
               : 'Setup unfinished, so nothing reaches you yet.<br><br>')
      + 'What you saved stays saved.<br>'
      + 'Start again from the app icon, or <code>agentduet-desktop</code>.</div>';
  };
</script>
</body>
</html>
