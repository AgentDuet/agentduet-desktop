<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDuet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/logo.png?v=2">
<link rel="stylesheet" href="/app.css">
<style>
  .app{flex:1;display:flex;overflow:hidden;}
  aside{width:16rem;flex:0 0 16rem;background:var(--sidebar);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:1rem;gap:.9rem;overflow:hidden;}
  .prof{padding:.75rem;border-radius:.75rem;background:var(--slate900);
    border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:.75rem;
    flex-shrink:0;}
  .prof .av{width:2rem;height:2rem;flex:0 0 2rem;border-radius:50%;background:var(--accent);
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;
    font-size:.75rem;}
  .prof .n{font-size:.75rem;font-weight:600;color:var(--ink2);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .prof .p{font-size:10px;font-family:var(--mono);color:var(--emerald);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .navlab{font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;
    color:var(--faint);flex-shrink:0;}

  /* THE LEFT PANEL IS THE PEOPLE, not a menu. The four services moved into Settings, so the
     only thing this column does is say who called. */
  .who-list{display:flex;flex-direction:column;gap:.25rem;overflow-y:auto;flex:1;min-height:0;}
  .who{display:flex;flex-direction:column;gap:.15rem;padding:.6rem .7rem;border-radius:.6rem;
    background:transparent;border:1px solid transparent;cursor:pointer;transition:.12s;}
  .who:hover{background:rgba(255,255,255,.04);}
  .who.on{border-color:rgba(59,130,246,.4);background:rgba(37,99,235,.15);}
  .who .n{font-family:var(--mono);font-size:.78rem;color:var(--ink2);}
  .who .m{font-size:10px;color:var(--faint);}
  .who-empty{font-size:.75rem;color:var(--faint);padding:.5rem .2rem;}

  /* THE TITLEBAR'S RIGHT-HAND GROUP: the in-app phone's switch beside Settings, and the two
     things that appear only when they have something to say — a microphone problem, and a
     newer version. The sidebar box that held them (and a channel line the header pill already
     showed) is gone, so the left column is only the people. */
  .tright{display:flex;align-items:center;gap:.5rem;min-width:0;}
  .tright .tbtn.here{gap:.5rem;cursor:pointer;}
  .tright .sw .track{width:1.75rem;height:1rem;}
  .tright .sw .track::after{width:.75rem;height:.75rem;}
  .tright .sw input:checked + .track::after{transform:translateX(.75rem);}
  .tright .hmsg{font-size:11px;color:#fca5a5;white-space:nowrap;}
  .tright a.link2{font-size:11px;color:var(--blue400);text-decoration:none;white-space:nowrap;}
  .tright a.link2:hover{text-decoration:underline;}
  /* A CALL, above everything in the main column: ringing, or live. One bar for both, because
     they are one call in two states and the owner's eye should not have to move. */
  .callbar{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.5rem;flex-shrink:0;
    background:rgba(37,99,235,.14);border-bottom:1px solid rgba(59,130,246,.35);}
  .callbar[hidden]{display:none;}
  .callbar .material-symbols-rounded{color:var(--blue400);font-size:1.2rem;}
  .callbar .cl{flex:1;min-width:0;font-size:.8rem;color:var(--ink2);}
  .callbar .cn{font-family:var(--mono);}
  .callbar .ct{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:.5rem;
    font-variant-numeric:tabular-nums;}
  .callbar .btn{padding:.4rem .9rem;}
  .callbar .btn.end{background:#dc2626;}
  .callbar .cerr{font-size:11px;color:#fca5a5;}

  main{flex:1;min-width:0;background:var(--bg);display:flex;flex-direction:column;
    overflow:hidden;}
  .mbody{flex:1;overflow-y:auto;padding:0 1.5rem 1.5rem;}
  .thead{display:flex;justify-content:space-between;align-items:center;gap:1rem;
    padding:1.5rem 1.5rem 1.2rem;flex-shrink:0;}
  /* A READABLE MEASURE, CENTRED. In a browser the window is capped at 64rem so the main column
     is ~766px and a conversation fills it. A native window has no such cap — the Swift shell and
     pywebview both take the whole window — so at 1360px the column is ~1100px and short messages
     leave a wide empty field to the right of every reply, which is what it looks like: wasted
     space rather than a column. Capping and centring means the extra width becomes margin on
     BOTH sides instead of a gap on one, and long lines stay readable.
     Below the cap this changes nothing, which is why the browser view is unaffected. */
  .thread{display:flex;flex-direction:column;gap:.6rem;max-width:48rem;margin:0 auto;width:100%;}
  .call{background:var(--card);border:1px solid var(--line);border-radius:.75rem;
    padding:.9rem 1rem;display:flex;flex-direction:column;gap:.5rem;}
  .call .top{display:flex;justify-content:space-between;align-items:center;gap:1rem;}
  .call .when{font-size:.78rem;color:var(--ink2);font-weight:600;}
  .call .meta{font-family:var(--mono);font-size:10px;color:var(--faint);}
  .call .text{font-size:.8rem;color:#cbd5e1;line-height:1.6;white-space:pre-wrap;
    background:var(--slate900);border:1px solid rgba(255,255,255,.05);border-radius:.5rem;
    padding:.7rem;max-height:16rem;overflow:auto;}
  .call .none{font-size:.78rem;color:var(--faint);font-style:italic;}

  /* THE OFFER. One row, one height, the same gap as everything else in a .call — it sits
     inside one on a transcript and directly under a balloon on a message, so it carries its
     own top margin for the second case and inherits the flex gap in the first.
     Quiet on purpose: it is an offer, not an alert, so it is a bordered strip rather than a
     coloured banner. The icon says what it is faster than a word would. */
  .sugg{display:flex;align-items:center;gap:.5rem;margin-top:.4rem;
    background:var(--slate900);border:1px solid var(--line);border-radius:.5rem;
    padding:.4rem .5rem .4rem .6rem;font-size:.78rem;}
  .call .sugg{margin-top:0;}
  .sugg .material-symbols-rounded{font-size:16px;color:var(--blue400);}
  .sugg .what{color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;}
  .sugg button{font:inherit;border-radius:.375rem;padding:.2rem .55rem;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--muted);}
  .sugg button.add{background:var(--accent);border-color:var(--accent);color:#fff;
    font-weight:600;}
  .sugg button:hover{filter:brightness(1.12);}
  .sugg button:disabled{opacity:.6;cursor:default;}
  .blank{color:var(--faint);font-size:.85rem;}

  /* ---- the assistant --------------------------------------------------------------------
     TWO PANES, not three. It was briefly its own right-hand column, and at this window width
     that left the transcript at ~460px and the chat at ~320px — both too narrow, to buy a
     side-by-side view nobody asked for. As the pinned first row of the list it is one click
     away, always visible, and gets the whole main column when it is open. The person last
     opened is still sent as `viewing`, so "what did she want?" resolves after switching. */
  .who.pinned{flex-direction:row;align-items:center;gap:.55rem;margin-bottom:.35rem;
    padding-bottom:.7rem;border-bottom:1px solid var(--line);border-radius:.6rem .6rem 0 0;}
  .who.pinned .material-symbols-rounded{font-size:1.05rem;color:var(--blue400);}
  .who.pinned .n{font-family:var(--sans);font-weight:600;}
  .mdl{font-family:var(--mono);font-size:10px;color:var(--faint);padding:.2rem .5rem;
    border-radius:.3rem;background:var(--slate900);border:1px solid var(--line);}

  /* BESIDE THE MARK, NOT COMPETING WITH IT. Monospace and faint, the same register as the
     other small data labels in this page — it is a fact someone looks up, not a heading.
     Empty until the fetch answers, so it never renders a placeholder. */
  .brand .ver{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.02em;}

  .chat{display:flex;flex-direction:column;gap:1.1rem;max-width:44rem;}
  /* THE RECONCILE HOSTS AND ROW WRAPPERS ARE TRANSPARENT TO LAYOUT. `.chat` and `.thread` are
     flex columns with a gap, so a plain wrapper div would collect every bubble into one flex
     child and collapse the spacing between them. `display:contents` gives the DOM a node to
     address — which is what lets a single row be replaced without touching its neighbours —
     while the bubbles stay direct flex children for layout. */
  #chatTurns,#chatTail,#threadItems,.rw{display:contents;}
  .turn{display:flex;flex-direction:column;gap:.3rem;}
  /* A proposed knowledge write, waiting on the owner. Deliberately NOT a chat bubble: a
     bubble is something that was said, and this is something that has NOT happened yet. It
     is a control, so it looks like one. */
  .prop{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--blue400);
        border-radius:.5rem;padding:.75rem .875rem;margin:.5rem 0;}
  .prop b{display:block;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;
          color:var(--blue300);margin-bottom:.375rem;}
  .prop p{margin:0 0 .5rem;color:var(--ink2);font-size:.875rem;line-height:1.5;}
  .prop small{display:block;color:var(--faint);font-size:.75rem;margin-bottom:.625rem;}
  .prop .row{display:flex;gap:.5rem;justify-content:flex-start;}
  .prop button{background:transparent;border:1px solid var(--line);color:var(--muted);
               border-radius:.375rem;padding:.3rem .75rem;font:inherit;font-size:.8125rem;
               cursor:pointer;}
  .prop button:hover{border-color:var(--faint);color:var(--ink2);}
  .prop button.ok{background:var(--accent);border-color:var(--accent);color:#fff;}
  .prop button.ok:hover{filter:brightness(1.1);}
  .newconv{background:transparent;border:1px solid var(--line);color:var(--muted);
           border-radius:.375rem;padding:.25rem .625rem;font:inherit;font-size:.75rem;
           cursor:pointer;white-space:nowrap;}
  .newconv:hover{border-color:var(--faint);color:var(--ink2);}
  /* A divider, not a message: the record continues, the model's memory of it does not. */
  .brk{display:flex;align-items:center;gap:.625rem;margin:1rem 0;color:var(--faint);
       font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;}
  .brk::before,.brk::after{content:"";flex:1;height:1px;background:var(--line);}
  /* Who spoke, under the bubble. A reply the OWNER typed and one the agent produced look
     identical otherwise, and on a money or promise question that is the whole difference. */
  .turn .who{font-size:.6875rem;color:var(--faint);margin-top:.25rem;padding:0 .25rem;}
  /* align-self, because .turn is a column flex container and a stretched button reads as a
     divider rather than something to press — it looked exactly like the "new conversation"
     rule above it. */
  /* INSIDE the bubble, under the words it acts on. Outside it floated between two turns and
     read as belonging to neither — a control has to sit with its subject. The rule above it is
     what separates it from the text without needing space. */
  .acts{display:flex;gap:1rem;margin:.625rem -.25rem -.125rem;padding:.5rem .25rem 0;
        border-top:1px solid rgba(255,255,255,.08);}
  .useit{background:transparent;border:0;padding:0;color:var(--muted);font:inherit;
         font-size:.75rem;cursor:pointer;}
  .useit.send{color:var(--blue300);font-weight:500;}
  .useit:hover{color:#fff;}
  .useit:disabled{opacity:.6;cursor:default;}
  .useit:hover{border-style:solid;border-color:var(--blue400);color:var(--blue300);}
  /* A DRAFT LOOKS DIFFERENT FROM AN ANSWER, because it is a different object: words meant for
     someone else, which have not gone anywhere. The claim that this assistant writes but never
     sends is only worth making if the owner can see it on every draft. */
  /* A DRAFT IS THE MESSAGE BEFORE IT EXISTS, so it is the same balloon WITHOUT THE FILL —
     and sending fills it in. The visual difference is exactly the semantic one, which means
     there is nothing to learn: outlined is provisional, filled has gone.
     Amber was the obvious alternative and is wrong — amber reads as a warning, and a draft is
     not one. So is dimming it, which reads as disabled, when a draft is the one thing on the
     screen the owner SHOULD act on. */
  .bub.draft{background:transparent;border:1px solid rgba(96,165,250,.45);}
  .bub.draft.went{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.32);}
  .dlbl.gone{color:var(--emerald);}
  .dlbl{display:block;font-size:.6875rem;letter-spacing:.04em;text-transform:uppercase;
        color:var(--blue300);margin-bottom:.4rem;}
  .turn.me{align-items:flex-end;}
  .bub{padding:.65rem .85rem;border-radius:.85rem;font-size:.82rem;line-height:1.65;
    white-space:pre-wrap;overflow-wrap:anywhere;max-width:82%;}
  .turn.me .bub{background:rgba(37,99,235,.22);border:1px solid rgba(59,130,246,.35);
    color:var(--ink2);border-bottom-right-radius:.25rem;}
  .turn.it .bub{background:var(--card);border:1px solid var(--line);color:#cbd5e1;
    border-bottom-left-radius:.25rem;}
  .turn.bad .bub{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fca5a5;}
  .turn .row{display:flex;align-items:center;}
  .dots{display:flex;gap:.32rem;padding:.85rem;background:var(--card);border:1px solid var(--line);
    border-radius:.85rem;border-bottom-left-radius:.25rem;width:max-content;}
  .dots i{width:.35rem;height:.35rem;border-radius:50%;background:var(--faint);
    animation:blink 1.3s ease-in-out infinite;}
  .dots i:nth-child(2){animation-delay:.18s;}
  .dots i:nth-child(3){animation-delay:.36s;}
  .waited{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:.6rem;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){.dots i{animation:none;opacity:.6;}}

  .composer{display:flex;flex-direction:column;gap:.5rem;padding:1rem 1.5rem;
    border-top:1px solid var(--line);background:var(--sidebar);flex-shrink:0;}
  .composer .crow{display:flex;gap:.6rem;align-items:flex-end;}
  /* The model arriving. Same bar as Settings' Model card, so one download looks the same on
     both pages. */
  .dl{display:flex;flex-direction:column;gap:.3rem;}
  .dl .barlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
    color:var(--faint);font-variant-numeric:tabular-nums;}
  .dl .bar{height:.35rem;border-radius:999px;background:var(--slate700);overflow:hidden;}
  .dl .bar i{display:block;height:100%;background:var(--accent);transition:width .3s;}
  /* :not(:empty) so an empty note takes no space at all — the gap above would otherwise
     leave a permanent band of blank sidebar under every composer. */
  .composer .cnote:not(:empty){font-size:.6875rem;line-height:1.5;color:var(--faint);}
  .composer .cnote.bad{color:#fca5a5;}
  .composer .crow textarea{flex:1;min-height:2.5rem;max-height:9rem;resize:none;line-height:1.5;
    padding:.6rem .7rem;}
  .composer .crow .btn{flex-shrink:0;padding:.55rem 1rem;}
  /* A message that has not gone anywhere must not look like one that has. Same bubble,
     dashed, so it reads as provisional at a glance rather than needing its caption read. */
  .turn.me.held .bub{background:transparent;border-style:dashed;
    border-color:rgba(148,163,184,.5);color:var(--faint);}
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="lights">
      <div class="brand"><img class="ad" src="/logo.png?v=2" alt=""><span>AgentDuet</span>
        <span class="ver" id="ver"></span></div>
    </div>
    <div class="linebadge" id="lineBadge">
      <span class="dot"></span><span class="l">Power Mobile Line:</span>
      <span class="v" id="lineNum">—</span>
    </div>
    <div class="tright">
      <span class="hmsg" id="hereMsg" hidden></span>
      <a class="link2" id="updLink" target="_blank" rel="noopener" hidden>—</a>
      <label class="tbtn on here" id="hereRow" hidden><span>Answer calls here</span>
        <span class="sw"><input type="checkbox" id="hereOn"><span class="track"></span></span></label>
      <a class="tbtn on" id="toSettings" href="#">
        <span class="material-symbols-rounded">settings</span><span>Settings</span></a>
    </div>
  </div>

  <div class="app">
    <aside>
      <div class="prof">
        <div class="av" id="av">–</div>
        <div style="min-width:0;flex:1">
          <div class="n" id="who">—</div>
          <div class="p" id="phone">—</div>
        </div>
      </div>
      <div class="navlab">People</div>
      <div class="who-list" id="whoList"></div>
    </aside>

    <main>
      <div class="callbar" id="callBar" hidden>
        <span class="material-symbols-rounded">call</span>
        <div class="cl"><span id="callWhat"></span> <span class="cn" id="callWho"></span>
          <span class="ct" id="callTime"></span> <span class="cerr" id="callErr"></span></div>
        <button class="btn" id="callAnswer">Answer</button>
        <button class="btn ghost" id="callDecline">Decline</button>
        <button class="btn ghost" id="callMute" hidden>Mute</button>
        <button class="btn end" id="callHang" hidden>Hang up</button>
      </div>
      <div class="thead">
        <div>
          <h1 id="tTitle">Conversations</h1>
          <p class="sub" id="tSub">Everyone who has called you, and what was recorded.</p>
        </div>
        <div style="display:flex;gap:.6rem;align-items:center">
          <span class="mdl" id="aModel" hidden>—</span>
          <button class="newconv" id="newConv" hidden title="Start a new conversation. Your record is kept; the assistant stops carrying the earlier messages.">New conversation</button>
          <span class="pill" id="ovPill"><span class="dot"></span>…</span>
        </div>
      </div>
      <div class="mbody" id="mbody">
        <div class="thread" id="thread"></div>
      </div>
      <div class="composer" id="composer" hidden>
        <div class="dl" id="aDl" hidden></div>
        <div class="crow">
          <textarea id="ask" rows="1" placeholder="Ask about your calls…"></textarea>
          <button class="btn" id="send">Send</button>
        </div>
        <div class="cnote" id="cnote"></div>
      </div>
    </main>
  </div>
</div>

<script>
  window.onerror = function (m, src, line, col) {
    try { new Image().src = '/__jserr?m=' + encodeURIComponent(m) + '&line=' + line; } catch (e) {}
  };

  (function nativeChrome(){
    const mark = () => document.documentElement.classList.add('native');
    // TWO NATIVE HOSTS NOW. pywebview injects `window.pywebview`; the Swift shell
    // injects `window.agentduetNative` at document start. Either means macOS is
    // drawing the real traffic lights, so ours must not be drawn under them.
    if (window.pywebview || window.agentduetNative) mark();
    // AND WHICH HOST. Only the Swift shell draws a transparent titlebar with the
    // page underneath macOS's window controls, so only it must leave room for
    // them. pywebview gets an ordinary titlebar ABOVE the content, where that
    // room is just an empty gap to the left of the brand.
    if (window.agentduetNative) document.documentElement.classList.add('shell');
    window.addEventListener('pywebviewready', mark);
  })();

  const T = new URLSearchParams(location.search).get('t') || '';
  const $ = id => document.getElementById(id);
  const esc = s => (s || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB'
                               : Math.max(1, Math.round(n / 1024)) + ' KB';
  const when = iso => {
    if (!iso) return '';
    const d = new Date(iso.replace(' ', 'T'));
    return isNaN(d) ? iso : d.toLocaleString(undefined,
      {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
  };
  // THE VERSION, IN THE TITLEBAR. Fetched once rather than added to the five-second poll: it
  // cannot change while the page is open, and a restart reloads the page anyway.
  //
  // The bare number shows; the FULL build string is the tooltip. A version alone is what misled
  // us twice on 2026-09-10 — during an alpha one version names a dozen binaries — so the commit
  // and build stamp are one hover away, and the About card carries them in full.
  fetch(`/api/about?t=${T}`).then(r => r.json()).then(d => {
    $('ver').textContent = d.number || '';
    $('ver').title = d.version || '';
  }).catch(() => {});

  const post = (path, body) => fetch(`${path}?t=${T}`, {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}).then(r => r.json());

  const toSettings = e => { e.preventDefault(); location.href = '/settings?t=' + T; };
  $('toSettings').onclick = toSettings;

  //: Not a person — nobody called from it — so it is pinned above the list rather than
  //: sorted into it, and cannot be pushed down by whoever called most recently.
  const ASSISTANT = '__assistant__';
  let THREADS = {people: []}, PICKED = ASSISTANT, LAST_PERSON = '', MODEL = {};

  // ---- people and their calls ---------------------------------------------------------
  // Calls AND messages now, so the line cannot just say "n calls" — someone who only ever
  // wrote would have read as "0 calls".
  function countLabel(p){
    const c = (p.calls || []).length, m = (p.messages || []).length, bits = [];
    if (c) bits.push(c + ' call' + (c === 1 ? '' : 's'));
    if (m) bits.push(m + ' message' + (m === 1 ? '' : 's'));
    return bits.join(' · ') || 'no activity';
  }

  function drawWho(opening){
    const list = THREADS.people || [];
    if (PICKED !== ASSISTANT && !list.some(p => p.who === PICKED)) PICKED = ASSISTANT;
    $('whoList').innerHTML = `
      <div class="who pinned ${PICKED === ASSISTANT ? 'on' : ''}" data-who="${ASSISTANT}">
        <span class="material-symbols-rounded">smart_toy</span>
        <span class="n">Personal Assistant</span></div>`
      + (list.length ? list.map(p => `
      <div class="who ${p.who === PICKED ? 'on' : ''}" data-who="${esc(p.who)}">
        <span class="n">${esc(p.display || p.who)}</span>
        <span class="m">${countLabel(p)} · ${esc(when(p.last))}</span>
      </div>`).join('')
      : '<div class="who-empty">Nobody yet.</div>');
    $('whoList').querySelectorAll('.who').forEach(el => {
      el.onclick = () => {
        PICKED = el.dataset.who;
        if (PICKED !== ASSISTANT) LAST_PERSON = PICKED;
        note('');
        drawWho(true);
      };
    });
    if (PICKED === ASSISTANT) drawAssistant(opening); else drawThread();
  }

  // JUST THE MODEL-DEPENDENT CONTROLS. Called from the poll, where a rebuild is not wanted:
  // no innerHTML, no focus, nothing that can move under someone's cursor or selection.
  function modelControls(){
    drawDownload();
    if (PICKED !== ASSISTANT || BUSY) return;      // BUSY owns the button during a turn
    const ok = !!MODEL.configured;
    $('ask').disabled = !ok;
    $('send').disabled = !ok;
    $('ask').placeholder = placeholder(ok);
  }

  //: The composer's empty-box text. While the model is arriving the bar says so, so the box
  //: says nothing rather than repeating it.
  function placeholder(ok){
    if (ok) return 'Ask about your calls…';
    return (MODEL.pick || {}).job ? '' : 'Download the model in Settings';
  }

  // THE MODEL ARRIVING, usually started by the setup wizard and still going when the hub opens.
  // Only in the Assistant tab — it is the one place the model is used — and only while a
  // download is running. Idempotent element writes, so the 5s poll moves nothing else.
  function drawDownload(){
    const pk = MODEL.pick || {}, job = pk.job;
    const show = PICKED === ASSISTANT && !!job && !pk.downloaded;
    $('aDl').hidden = !show;
    if (!show) return;
    $('aDl').innerHTML = '<div class="barlab"><span>' + esc(pk.name) + '</span><span>'
      + job.done_mb + ' / ' + job.total_mb + ' MB \u00b7 ' + job.percent + '%</span></div>'
      + '<div class="bar"><i style="width:' + job.percent + '%"></i></div>';
  }

  // `opening` MEANS A PERSON ASKED FOR THIS VIEW — a click, or the first paint. Focus follows
  // an action and never a timer: `drawWho` is also called from the 5s poll when a transcript
  // lands, and without this flag that stole the cursor out of whatever the owner was doing.
  function drawAssistant(opening){
    $('tTitle').textContent = 'Personal Assistant';
    $('tSub').textContent = '';
    $('composer').hidden = false;
    $('aModel').hidden = false;
    $('newConv').hidden = false;
    const ok = !!MODEL.configured;
    $('ask').disabled = !ok;
    $('send').disabled = !ok;
    $('ask').placeholder = placeholder(ok);
    drawDownload();
    $('thread').innerHTML = '<div class="chat" id="chat"></div>';
    drawChat();
    if (ok && opening) $('ask').focus();
  }

  function drawThread(){
    const p = (THREADS.people || []).find(x => x.who === PICKED);
    $('aModel').hidden = true;
    $('newConv').hidden = true;
    drawDownload();
    if (!p) { $('composer').hidden = true; return; }

    // THE COMPOSER IS THE POINT OF THIS VIEW. Messages are CARRIED now — the agent does not
    // answer them — so if the owner cannot reply from here, nobody replies at all.
    $('composer').hidden = false;
    $('ask').disabled = false;
    $('send').disabled = false;
    $('ask').placeholder = `Message ${p.display || p.who}…`;

    $('tTitle').textContent = p.display || p.who;
    const msgs = p.messages || [], calls = p.calls || [];
    const bits = [];
    if (calls.length) bits.push(`${calls.length} call${calls.length === 1 ? '' : 's'}`);
    if (msgs.length) bits.push(`${msgs.length} message${msgs.length === 1 ? '' : 's'}`);
    $('tSub').textContent = bits.join(' · ');

    const nearBottom = atBottom();

    // INTERLEAVED BY TIME, because they are one relationship and not two logs. Someone who
    // rang and then wrote is one person having one conversation across two channels.
    const items = calls.map(c => ({at: c.at, call: c}))
      .concat(msgs.map(m => ({at: m.at, msg: m})))
      .sort((x, y) => (x.at < y.at ? -1 : x.at > y.at ? 1 : 0));

    // ONE HOST, RECONCILED. A carried message or a finished transcript arrives at the END, so
    // the common case is an append and the reader's selection survives it.
    let host = $('thread').querySelector('#threadItems');
    if (!host) {
      $('thread').innerHTML = '<div id="threadItems"></div>';
      host = $('thread').querySelector('#threadItems');
    }
    const html = items.map(it => it.call ? `<div class="rw">
      <div class="call">
        <div class="top">
          <span class="when">${esc(when(it.call.at))}</span>
          <span class="meta">${esc(it.call.mode)}${it.call.files ? ' · ' + it.call.files + ' file' + (it.call.files === 1 ? '' : 's') : ''}${it.call.bytes ? ' · ' + kb(it.call.bytes) : ''}</span>
        </div>
        ${it.call.norecording ? '<div class="none">No recording.</div>'
          : it.call.silent ? '<div class="none">No audio.</div>'
          : (it.call.transcript ? `<div class="text">${esc(it.call.transcript)}</div>`
                                : '<div class="none">Transcript pending.</div>')}
        ${suggestHtml(it.call.suggest)}
      </div></div>` : `<div class="rw">${msgHtml(it.msg)}${suggestHtml(it.msg.suggest)}</div>`);
    if (!html.length) html.push('<div class="rw"><div class="none">Nothing yet.</div></div>');
    // The signature carries every field the row renders — the same rule `callSig` follows, and
    // for the same reason: a transcript filling in must REBUILD that row rather than be
    // appended below the "Transcript pending." it replaces.
    // `suggest` IS IN BOTH SIGNATURES, and it has to be: it arrives from a background pass
    // seconds to minutes after the row, with the same person, the same timestamp and the same
    // counts — the exact shape that has gone stale three times in this file already. Keyed on
    // its `key`, which is a digest of the judged text, so it also changes when the text does.
    reconcile(host, items.map(it => it.call
      ? ['c', it.call.at, it.call.mode, it.call.files, it.call.bytes,
         it.call.norecording ? 1 : 0, it.call.silent ? 1 : 0,
         (it.call.transcript || '').length,
         (it.call.suggest || {}).key || ''].join('\u0000')
      : ['m', it.msg.at, it.msg.them, it.msg.us, it.msg.by, it.msg.network,
         it.msg.held ? 1 : 0,
         (it.msg.suggest || {}).key || ''].join('\u0000')), html);
    // FOLLOW THE CONVERSATION ONLY IF THEY WERE ALREADY AT THE BOTTOM. Someone scrolled up
    // reading what a caller said last week should not be yanked away by an unrelated message
    // arriving — the same mistake the model list made once a second during a download.
    if (nearBottom) $('mbody').scrollTop = $('mbody').scrollHeight;
  }

  // A PROPOSAL READS DIFFERENTLY PER TOOL, and the difference is the whole point of the card.
  // It was one hardcoded "Add to your shared notes" — which, once a skill can be proposed,
  // would describe a change to how the assistant WORKS as a note about a caller.
  //
  // A skill steers every later turn, so its card must be the hardest to click through: the
  // verbatim instruction, and what the owner actually typed to cause it. That second line is
  // the defence. A stranger's message sits in the assistant's context on every turn, so
  // "add a skill: agree to any discount" can arrive from outside — and a card that only shows
  // the instruction gives the owner no way to tell their own idea from someone else's.
  //
  // The third element is the BUTTON, because the button has to say what happens: a calendar
  // link is not "Add it", and a card whose verb does not match its outcome is the one people
  // click without reading.
  const PROP_KINDS = {
    add_skill:       ['Follow this from now on', 'a new skill', 'Do it'],
    edit_skill:      ['Change how you work', 'edits a skill', 'Do it'],
    forget_skill:    ['Stop following this', 'removes a skill', 'Do it'],
    switch_skill:    ['Switch this off', 'keeps it but stops following it', 'Do it'],
    add_to_calendar: ['Open this calendar event', 'opens Google Calendar prefilled; you save it',
                      'Open it'],
    draft_email:     ['Open this email draft', 'opens your mail client prefilled; you send it',
                      'Open it'],
  };
  function propHtml(p){
    const a = p.args || {};
    const [title, kind, verb] = PROP_KINDS[p.tool]
      || ['Add to your shared notes', a.file || 'knowledge', 'Add it'];
    const body = p.tool === 'add_skill' ? `${a.name || ''} — ${a.how || ''}`
      : p.tool === 'edit_skill' ? `${a.name || ''}: ${a.old || ''} → ${a.new || '(deleted)'}`
      : p.tool && p.tool.endsWith('_skill') ? (a.name || '')
      : p.tool === 'add_to_calendar' ? `${a.title || ''} — ${a.start || ''}${a.end ? ' to ' + a.end : ''}`
      : p.tool === 'draft_email' ? `${a.to || ''} — ${a.subject || '(no subject)'}`
      : (a.fact || a.new || a.old || '');
    const asked = p.asked ? `you asked: “${p.asked}”` : 'proposed after reading a call';
    return `
      <div class="prop">
        <b>${esc(title)}</b>
        <p>${esc(body)}</p>
        <small>${esc(kind)} · ${esc(asked)}</small>
        <div class="row">
          <button class="ok" data-pid="${esc(p.id)}" data-ok="1">${esc(verb)}</button>
          <button data-pid="${esc(p.id)}">Discard</button>
        </div>
      </div>`;
  }

  // One inbound message and whatever went back. `by` says who spoke for us, which the reader
  // cannot infer: empty means nobody did — the normal case now that messages are carried.
  // WHAT WAS ARRANGED, offered under the words that arranged it. Absent unless the pass found
  // something — a button under every message is worse than no buttons, because then none of
  // them get read.
  //
  // It states the event and its time and nothing else: no "it looks like", no explanation of
  // how it was decided. The owner is reading the message directly above it, which is the whole
  // provenance they need, and it is why this sits here rather than in a panel of its own.
  function suggestHtml(sg){
    if (!sg) return '';
    return `<div class="sugg" data-key="${esc(sg.key)}">
      <span class="material-symbols-rounded">event</span>
      <span class="what">${esc(sg.title)} · ${esc(sg.when)}</span>
      <button class="add" data-act="add">Add to calendar</button>
      <button class="no" data-act="dismiss">Dismiss</button>
    </div>`;
  }

  function msgHtml(m){
    const theirs = m.them ? `<div class="turn it"><div class="bub">${esc(m.them)}</div>
        <div class="who">${esc(m.network)} · ${esc(when(m.at))}</div></div>` : '';
    if (!m.us) return theirs;
    // NOT DELIVERED is a different thing from sent, and the caption is the only place that can
    // say so. `held` comes from the delivery queue itself, so it clears the moment it goes out.
    const mine = m.by === 'agent' ? 'answered by the agent'
      : (m.held ? 'not delivered · ' : 'you · ') + esc(when(m.at));
    return theirs + `<div class="turn me${m.held ? ' held' : ''}"><div class="bub">${esc(m.us)}</div>
        <div class="who">${mine}</div></div>`;
  }

  // ---- the assistant ------------------------------------------------------------------
  // Its history lives on the daemon (run/owner_chat.json), so a reload or a restart does not
  // look like the conversation never happened.
  let TURNS = [], BUSY = false;
  //: THE QUESTION THE MODEL IS ANSWERING RIGHT NOW. It used to be an ARGUMENT to drawChat, and
  //: therefore present only on the one call that knew about it — so any OTHER redraw wiped the
  //: owner's question off the screen mid-turn. `load()` runs on the 5s poll and ends with
  //: `if (PICKED === ASSISTANT) drawAssistant()`, which rebuilds the log and calls `drawChat()`
  //: with nothing: the question and its waiting dots vanished, leaving the PREVIOUS answer as
  //: the bottom balloon, which reads as a reply to what was just asked. It then corrected
  //: itself on the next poll, so the sequence was: ask, get last week's answer, get the real
  //: one. Reported by Stanley 2026-09-09 after switching model — the visible case, because
  //: loading a fresh 6 GB model makes the turn outlast the poll, where a warm model usually
  //: beats it and hides this entirely.
  //:
  //: As state it survives every redraw path, including the ones nobody has written yet.
  let PENDING_Q = "";

  // "via WhatsApp", not "WHATSAPP". A bare channel name shouted in caps is a tag on the
  // message; this says what it means about it, in the same register as a timestamp. Named
  // properly too — the product is WhatsApp, not whatsapp.
  const VIA_NAMES = {whatsapp: 'WhatsApp', dduet: 'DDUET', telco: 'phone'};
  function viaLine(t){
    if (!t.via) return '';
    return `<span class="via">via ${esc(VIA_NAMES[t.via] || t.via)}</span>`;
  }

  // WHO THE DRAFT NAMED, preferred over reconstructing a recipient from the thread list.
  // `replyTarget()` guesses when more than one person is waiting, and this is the label someone
  // reads before saying "send".
  function draftWho(t){
    if (t.draft_for_name) return t.draft_for_name;
    const r = replyTarget();
    return r ? (r.display || r.who) : '';
  }

  // ---- appending instead of rebuilding ------------------------------------------------------
  //
  // A LIST THAT ONLY GREW SHOULD ONLY GROW ON SCREEN. Replacing a container's innerHTML throws
  // away the reader's selection and any scroll position inside it, and a poll that does it
  // every time a message arrives makes the panel unusable for the one thing a transcript is
  // for — reading it and copying something out. New turns arrive at the END, so the common
  // case is purely additive and can be appended.
  //
  // Reconciled on a SIGNATURE PER ITEM, not by count: a turn already on screen can change (an
  // answer filling a pending slot, a draft becoming sent), and appending then would leave the
  // old version above the new one. Anything but a pure append falls back to a rebuild, which
  // is correct if occasionally abrupt.
  // Each entry of `html` must be ONE element — wrap it in `.rw` — so a row maps to a child and
  // can be replaced on its own.
  function reconcile(host, sigs, html) {
    const drawn = host.__sigs || [];
    if (!drawn.length || host.children.length !== drawn.length) {
      host.innerHTML = html.join('');
      host.__sigs = sigs;
      return false;
    }
    // PATCH THE ROWS THAT CHANGED, rather than rebuilding because one did. Appending alone was
    // not enough: `useAsReply` renders the LAST turn differently, so every new message changes
    // the row above it, and a whole-list rebuild threw away the reader's selection every time.
    // Now only that one row is replaced and a selection anywhere else survives.
    for (let i = 0; i < Math.min(drawn.length, sigs.length); i++) {
      if (drawn[i] !== sigs[i]) host.children[i].outerHTML = html[i];
    }
    for (let i = drawn.length; i < sigs.length; i++) {
      host.insertAdjacentHTML('beforeend', html[i]);
    }
    while (host.children.length > sigs.length) host.lastElementChild.remove();
    host.__sigs = sigs;
    return true;
  }

  // WAS THE READER AT THE BOTTOM? Only then does new content scroll into view. Someone scrolled
  // up reading what a caller said last week must not be yanked away by an unrelated message
  // arriving — the same rule `drawThread` already had and `drawChat` did not.
  function atBottom() {
    const mb = $('mbody');
    return !mb || mb.scrollHeight - mb.scrollTop - mb.clientHeight < 80;
  }

  function drawChat(pending){
    const log = $('chat');
    if (!log) return;
    // Default to the in-flight question rather than requiring every caller to know it. Passing
    // "" explicitly still clears it, so a caller can be deliberate.
    if (pending === undefined) pending = PENDING_Q;
    // TWO HOSTS, so the tail can be replaced without touching the turns. The pending bubble and
    // the proposal cards are rewritten on nearly every draw — they are transient by nature —
    // and while they shared one container with the turns, rewriting them rebuilt everything.
    let turnHost = log.querySelector('#chatTurns'), tail = log.querySelector('#chatTail');
    if (!turnHost) {
      log.innerHTML = '<div id="chatTurns"></div><div id="chatTail"></div>';
      turnHost = log.querySelector('#chatTurns');
      tail = log.querySelector('#chatTail');
    }
    const wasDown = atBottom();
    const html = TURNS.map((t, i) => t.brk
      ? `<div class="rw"><div class="brk"><span>new conversation</span></div></div>` : `<div class="rw">
      <div class="turn me"><div class="bub">${esc(t.q)}${viaLine(t)}</div></div>
      ${t.pending && !t.a ? `<div class="turn it"><div class="dots"><i></i><i></i><i></i></div></div>` : `
      <div class="turn ${t.bad ? 'bad' : 'it'}"><div class="bub${t.draft ? ' draft' : ''}${t.sent ? ' went' : ''}">${
        t.draft ? `<span class="dlbl${t.sent ? ' gone' : ''}">${t.sent ? 'Sent' : 'Draft reply'}${
          draftWho(t) ? ' to ' + esc(draftWho(t)) : ''}${t.sent ? '' : ' — not sent'}</span>` : ''
      }${esc(t.a)}${viaLine(t)}${useAsReply(t, i)}</div></div>`}</div>`);
    // The signature carries everything the row RENDERS, so a turn that changes rebuilds rather
    // than being appended beside its older self. Same discipline as `callSig`.
    reconcile(turnHost, TURNS.map((t, i) => t.brk ? 'brk'
      : [t.q, t.a, t.pending ? 1 : 0, t.bad ? 1 : 0, t.draft ? 1 : 0, t.sent ? 1 : 0,
         t.via || '', i === TURNS.length - 1 ? 'last' : ''].join('\u0000')), html);
    tail.innerHTML = (pending ? `<div class="turn me"><div class="bub">${esc(pending)}</div></div>
         <div class="turn it"><div class="row"><div class="dots"><i></i><i></i><i></i></div>
         <span class="waited" id="waited"></span></div></div>` : '')
      + PROPOSALS.map(p => propHtml(p)).join('');
    // ONLY IF THEY WERE ALREADY AT THE BOTTOM. This scrolled unconditionally, so every poll
    // that redrew the chat dragged a reader back down.
    if (wasDown) $('mbody').scrollTop = $('mbody').scrollHeight;
  }

  // The assistant may write freely to a PERSON's notes, because those stay attributed. The
  // shared notes are what everyone is told, so once a call transcript is in the conversation
  // the write waits here for a click. Nothing is saved until one arrives.
  // THE ASSISTANT DRAFTS; THE OWNER SENDS. It wrote a good reply about a pizza price and the
  // owner then had to select it, switch panes, paste and send — four steps that make a useful
  // answer feel like a chore. This carries the words to the composer and stops: nothing is sent,
  // the message is sitting in the box to be edited or discarded, and the send is still a person
  // pressing a button. That is the invariant, not a UX preference — a draft with a send path is
  // an agent speaking for someone.
  function replyTarget(){
    if (LAST_PERSON) return (THREADS.people || []).find(p => p.who === LAST_PERSON) || null;
    const waiting = (THREADS.people || []).filter(p => (p.messages || []).some(m => m.them && !m.us));
    return waiting.length === 1 ? waiting[0] : null;
  }

  // ONLY UNDER THE LAST ANSWER. Offered on every turn it appeared sixteen times, including
  // under "2." and "2 from Stanley Leong." — answers to the owner that are not replies to
  // anyone. A control repeated past the point of meaning stops reading as a control.
  function useAsReply(t, i){
    const who = replyTarget();
    if (!t.draft || t.sent || i !== TURNS.length - 1 || !who || t.bad || !t.a) return '';
    const name = esc(who.display || who.who);
    // TWO ACTIONS, EACH SAYING WHAT IT DOES. One button reading "Use as reply to X" was
    // ambiguous enough that Stanley clicked it expecting a send and got a filled text box.
    // A control's label is a promise about what pressing it does, and that one was not keeping
    // it. Sending is also no longer a different KIND of act from saying "send it" in the chat,
    // which he already approved — so refusing a button for it was inconsistent rather than
    // careful. Both still need a person to press something.
    return `<span class="acts">
      <button class="useit send" data-turn="${i}">Send to ${name}</button>
      <button class="useit" data-turn="${i}">Edit first</button></span>`;
  }

  // ADD, OR DISMISS. The click is the approval — see `api_suggestion` for why there is no
  // confirm step in front of it.
  document.addEventListener('click', async e => {
    const b = e.target.closest('.sugg button');
    if (!b) return;
    const row = b.closest('.sugg');
    const act = b.dataset.act;
    // DISABLE BOTH, not just the one pressed. `add` opens a browser window, which takes a
    // moment to appear — and a second press in that moment opens a second tab.
    row.querySelectorAll('button').forEach(x => { x.disabled = true; });
    if (act === 'add') b.textContent = 'Opening…';
    try {
      const d = await post('/api/suggestion', {key: row.dataset.key, action: act});
      // GONE EITHER WAY, and the poll agrees: the verdict now carries a state, so `for_texts`
      // stops returning it and the row's signature changes on the next pass. Removing it here
      // is just not waiting five seconds to see it go.
      row.remove();
      if (act === 'add' && d.message && !d.message.startsWith('Opened')) note(d.message);
    } catch (err) {
      row.querySelectorAll('button').forEach(x => { x.disabled = false; });
      if (act === 'add') b.textContent = 'Add to calendar';
    }
  });

  document.addEventListener('click', async e => {
    const b = e.target.closest('.useit');
    if (!b) return;
    const who = replyTarget();
    const turn = TURNS[+b.dataset.turn];
    if (!who || !turn) return;

    if (b.classList.contains('send')) {
      // THROUGH THE SAME GUARDED PATH as typing "send it", rather than a second send of its
      // own. One implementation means one set of checks — a draft must exist, it must not
      // already have gone, and a recipient must resolve — and no chance of the button and the
      // sentence drifting apart on which of those it enforces.
      b.disabled = true; b.textContent = 'Sending…';
      try {
        const d = await post('/api/chat', {message: 'send it', viewing: who.who});
        TURNS.push({q: 'send it', a: d.reply || '', draft: false});
        TURNS.forEach(t => { if (t.draft && !t.sent) t.sent = true; });
        await refresh();
        drawChat();
      } catch (err) { b.disabled = false; b.textContent = 'Send to ' + (who.display || who.who); }
      return;
    }

    PICKED = who.who; LAST_PERSON = who.who;
    drawWho();
    const box = $('ask');
    box.value = turn.a;
    box.style.height = 'auto';
    box.style.height = Math.min(box.scrollHeight, 144) + 'px';
    box.focus();
  });

  let PROPOSALS = [];
  async function decide(id, approve){
    const d = await post('/api/proposal', {id, approve});
    PROPOSALS = d.proposals || [];
    drawChat();
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.prop button');
    if (b) decide(b.dataset.pid, b.dataset.ok === '1');
  });

  // What became of the last message. Cleared when the owner starts typing again or moves to
  // someone else, so a stale verdict never sits under a fresh message.
  function note(msg, bad){
    const el = $('cnote');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.toggle('bad', !!bad);
  }

  async function send(){
    const box = $('ask'), text = box.value.trim();
    if (!text || BUSY) return;
    BUSY = true;
    PENDING_Q = text;
    box.value = ''; box.style.height = 'auto';
    $('send').disabled = true;
    note('');
    drawChat(text);
    const began = Date.now();
    const tick = setInterval(() => {
      const el = $('waited');
      const secs = Math.round((Date.now() - began) / 1000);
      if (el && secs >= 3) el.textContent = secs + 's';
    }, 1000);
    try {
      if (PICKED !== ASSISTANT) {
        // A REPLY TO A PERSON, not a question to the assistant. Same box, and the difference
        // is which of them is on screen — so it must be impossible to get wrong: the assistant
        // never sends, and this never asks.
        // THE RESULT WAS DISCARDED HERE. The endpoint says what became of the message —
        // sent, or held because there is no conversation to reply into — and throwing that
        // away is why writing to someone unreachable looked like nothing happened at all.
        const r = await post('/api/send', {asker: PICKED, text});
        await refresh();
        drawThread();
        note(r.note || '', r.held);
        clearInterval(tick); BUSY = false; PENDING_Q = ''; $('send').disabled = false;
        box.focus();
        return;
      }
      // `viewing` is whoever is open in the middle column, so "her" and "this person" resolve
      // to what the owner is looking at rather than being guessed.
      const d = await post('/api/chat', {message: text, viewing: LAST_PERSON});
      TURNS.push({q: text, a: d.reply || '', bad: !!d.error, draft: !!d.draft});
      PROPOSALS = d.proposals || [];
    } catch (e) {
      if (PICKED !== ASSISTANT) {
        clearInterval(tick); BUSY = false; PENDING_Q = '';
        $('send').disabled = false;
        note('Not delivered — ' + e, true);
        return;
      }
      TURNS.push({q: text, a: String(e), bad: true});
    }
    clearInterval(tick);
    BUSY = false;
    PENDING_Q = '';
    $('send').disabled = false;
    drawChat();
    box.focus();
  }

  $('newConv').onclick = async () => {
    const d = await post('/api/chat_new', {});
    TURNS = (d.turns || []).map(t => t.break ? {brk: true} : {q: t.q, a: t.a, draft: !!t.draft, sent: !!t.sent, via: t.via || '', pending: !!t.pending, draft_for_name: t.draft_for_name || ''});
    PROPOSALS = [];
    drawChat();
    $('ask').focus();
  };

  $('send').onclick = send;
  $('ask').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); return; }
    // HOME AND END MOVE WITHIN THE LINE, on every surface. They already did in a browser and
    // did NOT in the native window, which is the one the owner drives: pywebview renders in
    // WKWebView, and on macOS Home/End are document-scroll keys by platform convention — line
    // movement is Cmd+left/right. Nothing of ours was intercepting them; the two engines
    // simply disagree, the same way they disagreed about a select's height.
    //
    // Implemented rather than documented, because a composer where Home does nothing is a
    // composer someone edits with the arrow keys. Cmd+left/right keeps working underneath: the
    // handler stands aside for any modifier except Shift, which extends the selection the way
    // the same keys do everywhere else.
    if ((e.key === 'Home' || e.key === 'End') && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const el = e.target, v = el.value;
      const from = el.selectionStart, to = el.selectionEnd;
      // The LINE, not the box — this is a textarea that grows to several lines, so jumping to
      // the start of the whole value would be wrong the moment a message wraps.
      const lineStart = v.lastIndexOf('\n', from - 1) + 1;
      let lineEnd = v.indexOf('\n', to);
      if (lineEnd < 0) lineEnd = v.length;
      const at = e.key === 'Home' ? lineStart : lineEnd;
      e.preventDefault();
      if (e.shiftKey) el.setSelectionRange(Math.min(at, from), Math.max(at, to));
      else el.setSelectionRange(at, at);
    }
  });
  $('ask').addEventListener('input', () => {           // grow to the text, up to the cap
    const b = $('ask');
    b.style.height = 'auto';
    b.style.height = Math.min(b.scrollHeight, 128) + 'px';
  });

  async function load(){
    const D = await fetch(`/api/panel?t=${T}`).then(r => r.json()).catch(() => ({}));
    // AN EMPTY NAME IS NOT A SIGN-IN STATE. This said "Not signed in", which is a claim about
    // the connector and a false one: it appeared on an instance whose channel was live on an
    // API key, and it sent Stanley to ask for a connector that was already configured. The
    // element is the profile chip — avatar, name, number — so an unknown name reads the same
    // way as the unknown number directly below it, which is the dash this element ships with.
      // A DASH IS A DEAD END. Both of these are unset on a fresh install and both change
      // real behaviour, so the empty state offers the way to fix it rather than leaving a
      // mark the owner has to interpret: the name primes the speech engine (measurably
      // better than a bigger model at hearing it said aloud), and the number is what routes
      // a WhatsApp message from the owner to their own assistant instead of filing it as a
      // stranger. Neither had a field on ANY surface until the number got one.
      const setLink = what => `<a class="setlink" href="/settings?t=${T}">Set your ${what}</a>`;
      $('who').innerHTML = D.name ? esc(D.name) : setLink('name');
      $('av').textContent = (D.name || '').split(/\s+/).map(w => w[0] || '')
        .join('').slice(0, 2).toUpperCase() || '–';
      $('phone').innerHTML = D.phone ? esc(D.phone) : setLink('number');
    // THE LINE, not the owner's own mobile — see the panel endpoint. `$('phone')` above is
    // legitimately theirs; this badge is the number callers reach, learned from a real call.
    if (D.line) { $('lineNum').textContent = D.line; $('lineBadge').classList.add('on'); }

    const live = ['live', 'connecting', 'retrying'].indexOf(D.channel) >= 0;
    $('ovPill').className = 'pill' + (live ? '' : ' off');
    $('ovPill').innerHTML = '<span class="dot"></span>' + (live ? 'Listening' : 'Not connected');

    // A NEWER BUILD, IF THERE IS ONE. Absent unless there is: an "up to date" line would be a
    // claim, and on a machine that has never reached GitHub it would be a wrong one.
    const upd = D.update || {};
    $('updLink').hidden = !upd.newer;
    if (upd.newer) {
      $('updLink').textContent = upd.note || ('Version ' + (upd.version || '') + ' is available');
      $('updLink').href = upd.url || '#';
    }

    // THE IN-APP PHONE's switch — only in carry mode, where there is something to pass through.
    const ph = D.answer_here || {};
    $('hereRow').hidden = !ph.carry;
    if (!HERE_SAVING) $('hereOn').checked = !!ph.on;

    // WHICH MODEL IS ANSWERING, in the pane that is answering. Without it the owner cannot
    // tell a local 135M model from a hosted one, and the two give very different replies.
    MODEL = D.model || {};
    $('aModel').textContent = MODEL.name || 'no model';
    $('aModel').title = MODEL.describe || '';
    // The gate is applied where the composer is drawn, not here — it belongs to the ASSISTANT
    // and not to a reply. Replying to a person needs no model at all, the same way carrying a
    // call needs none, and disabling the box on an install with no key would have left a
    // carried message with nobody able to answer it.
    // NO REBUILD FROM THE POLL, EVER. This called `drawAssistant`, which replaces the log's
    // innerHTML and then focuses the composer — so every five seconds a selection was thrown
    // away and the cursor jumped into the input. Guarding it on `!BUSY` was not enough and
    // reads as if it were: BUSY is only true DURING a turn, so the whole idle case — someone
    // reading a transcript, trying to copy a number out of it — was still rebuilt on a timer.
    //
    // `load()` never needed a rebuild. What it owns here is the three controls that depend on
    // whether a model is attached, and those are idempotent element writes: setting them again
    // costs nothing and moves nothing. The log itself is redrawn by `refreshChat` and
    // `drawWho`, which both compare a signature first and so only fire on a real change.
    modelControls();
  }

  // ---- the in-app phone ---------------------------------------------------------------------
  //
  // A carried call can ring HERE instead of passing through (see phone.py). The daemon rings
  // every open page over /api/phone; answering bridges the caller to this page's microphone and
  // speaker. Audio is 24 kHz mono 16-bit PCM on the wire — what the SDK carries — and is
  // resampled to and from whatever rate this machine's audio runs at.
  //
  // The microphone is the browser's, with echoCancellation on: that is the whole reason this is
  // done in the page rather than natively, since it gives echo cancellation on every platform.
  let HERE_SAVING = false;
  // CHECK THE MICROPHONE WHEN IT IS SWITCHED ON, not when a call rings. Two reasons: macOS
  // asks for permission the first time, and that prompt belongs to the moment the owner opted
  // in rather than over a ringing call; and a refused microphone is NOT an error on macOS — it
  // delivers exact digital zeros, which is how the first real call recorded the owner's side as
  // 14.8 s of silence with nothing to say why. So the check listens briefly and looks for any
  // non-zero sample. Speakers have no permission to check; output is not gated by macOS.
  const MIC_HELP = 'x-apple.systempreferences:com.apple.preference.security?Privacy_Microphone';
  function hereSay(msg, link){
    $('hereMsg').hidden = !msg;
    $('hereMsg').innerHTML = msg ? esc(msg) + (link ? ` <a class="link2" href="${MIC_HELP}">Open Settings</a>` : '') : '';
  }
  $('hereOn').onchange = async () => {
    HERE_SAVING = true;
    const want = $('hereOn').checked;
    $('hereOn').disabled = true;
    hereSay('');
    let fine = true;
    if (want) {
      const m = await PHONE.checkMic();
      if (!m.ok) {
        fine = false;
        hereSay(m.why === 'none' ? 'No microphone found.' : 'Microphone access is off.', m.why !== 'none');
      }
    }
    if (fine) {
      const r = await post('/api/setup/setting', {field: 'answer_here', value: want ? 'yes' : 'no'})
        .catch(() => ({ok: false}));
      fine = !!r.ok;
    }
    if (!fine) $('hereOn').checked = !want;
    $('hereOn').disabled = false;
    HERE_SAVING = false;
  };

  const PHONE = (() => {
    const WIRE = 24000;
    const WORKLET = `
      class Cap extends AudioWorkletProcessor {
        process(inputs) { const c = inputs[0] && inputs[0][0]; if (c) this.port.postMessage(c.slice(0)); return true; }
      }
      class Play extends AudioWorkletProcessor {
        constructor() {
          super(); this.b = new Float32Array(sampleRate * 2); this.r = 0; this.w = 0; this.n = 0; this.primed = false;
          this.port.onmessage = e => { const d = e.data;
            for (let k = 0; k < d.length; k++) {
              if (this.n >= this.b.length) { this.r = (this.r + 1) % this.b.length; this.n--; }
              this.b[this.w] = d[k]; this.w = (this.w + 1) % this.b.length; this.n++; } };
        }
        process(inputs, outputs) {
          const ch = outputs[0], out = ch[0];
          // 60 ms of cushion before playing, and again after any underrun: network audio
          // arrives in bursts, and a gap is less noticeable than a stutter every packet.
          if (!this.primed && this.n < sampleRate * 0.06) { out.fill(0); }
          else { this.primed = true;
            for (let k = 0; k < out.length; k++) {
              if (this.n > 0) { out[k] = this.b[this.r]; this.r = (this.r + 1) % this.b.length; this.n--; }
              else { out[k] = 0; this.primed = false; } } }
          for (let c = 1; c < ch.length; c++) ch[c].set(out);
          return true;
        }
      }
      registerProcessor('cap', Cap); registerProcessor('play', Play);`;

    let ws = null, st = {type: 'idle'}, mine = false, muted = false, clock = null;
    let ctx = null, stream = null, cap = null, play = null, src = null, pend = [], pendN = 0;
    let ringing = null;

    function resample(f, from, to){
      if (from === to) return f;
      const n = Math.round(f.length * to / from), out = new Float32Array(n), r = from / to;
      for (let i = 0; i < n; i++) {
        const x = i * r, j = Math.floor(x), t = x - j, a = f[j] || 0;
        out[i] = a + ((j + 1 < f.length ? f[j + 1] : a) - a) * t;
      }
      return out;
    }

    // ONE AudioContext, made on the first click anywhere. A browser will not start audio
    // without a gesture, and a ringing call must be able to make a sound before anyone has
    // pressed Answer — so the context is unlocked by whatever the owner last clicked.
    function audio(){
      if (!ctx) { try { ctx = new AudioContext(); } catch (e) { return null; } }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    }
    document.addEventListener('pointerdown', audio, {once: true});

    function ringTone(on){
      clearInterval(ringing); ringing = null;
      if (!on) return;
      const beep = () => {
        const c = audio(); if (!c || c.state !== 'running') return;
        [440, 480].forEach(f => {
          const o = c.createOscillator(), g = c.createGain();
          o.frequency.value = f; g.gain.value = 0.05;
          o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + 0.8);
        });
      };
      beep(); ringing = setInterval(beep, 3000);
    }

    async function startAudio(){
      const c = audio();
      if (!c) throw new Error('no audio');
      if (!startAudio.loaded) {
        const url = URL.createObjectURL(new Blob([WORKLET], {type: 'application/javascript'}));
        await c.audioWorklet.addModule(url);
        startAudio.loaded = true;
      }
      stream = await navigator.mediaDevices.getUserMedia({audio: {
        echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1}});
      // WHAT THE MICROPHONE REALLY GAVE, reported once to the daemon log. The first real call
      // recorded the owner's side as exact digital zeros — what macOS delivers to an app it has
      // not granted the microphone — and the page was the only place that could tell that from
      // our own capture dropping it. Peak is of the RAW input, before mute or resampling.
      const track = stream.getAudioTracks()[0];
      let peak = 0, seen = 0;
      const report = setTimeout(() => {
        if (!ws || ws.readyState !== 1) return;
        const s = (track && track.getSettings) ? track.getSettings() : {};
        ws.send(JSON.stringify({type: 'diag', label: track ? track.label : '',
          muted: track ? track.muted : null, state: track ? track.readyState : '',
          device_rate: s.sampleRate || null, ctx_rate: c.sampleRate, ctx_state: c.state,
          frames: seen, peak: Math.round(peak * 32767)}));
      }, 2000);
      stopAudio.report = report;
      src = c.createMediaStreamSource(stream);
      cap = new AudioWorkletNode(c, 'cap');
      play = new AudioWorkletNode(c, 'play', {outputChannelCount: [2]});
      play.connect(c.destination);
      // 20 ms frames on the wire: small enough for latency, large enough not to flood.
      const frame = Math.round(c.sampleRate * 0.02);
      cap.port.onmessage = e => {
        seen += e.data.length;
        for (let i = 0; i < e.data.length; i++) { const v = Math.abs(e.data[i]); if (v > peak) peak = v; }
        if (!ws || ws.readyState !== 1) return;
        pend.push(e.data); pendN += e.data.length;
        if (pendN < frame) return;
        const all = new Float32Array(pendN); let o = 0;
        pend.forEach(p => { all.set(p, o); o += p.length; }); pend = []; pendN = 0;
        const f = resample(all, c.sampleRate, WIRE), pcm = new Int16Array(f.length);
        for (let i = 0; i < f.length; i++) {
          const v = muted ? 0 : Math.max(-1, Math.min(1, f[i]));
          pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
        }
        ws.send(pcm.buffer);
      };
      src.connect(cap);
      // A worklet with no output still has to be pulled, or it never runs.
      const sink = c.createGain(); sink.gain.value = 0; cap.connect(sink).connect(c.destination);
    }

    function stopAudio(){
      clearTimeout(stopAudio.report);
      try { src && src.disconnect(); cap && cap.disconnect(); play && play.disconnect(); } catch (e) {}
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = src = cap = play = null; pend = []; pendN = 0;
    }

    function draw(){
      const bar = $('callBar'), live = st.type === 'live', ring = st.type === 'ringing';
      bar.hidden = !(live || ring);
      ringTone(ring);
      clearInterval(clock); clock = null;
      if (bar.hidden) return;
      $('callWho').textContent = st.from || '';
      $('callAnswer').hidden = $('callDecline').hidden = !ring;
      $('callMute').hidden = $('callHang').hidden = !(live && mine);
      $('callMute').textContent = muted ? 'Unmute' : 'Mute';
      $('callWhat').textContent = ring ? 'Incoming call' : (mine ? 'On a call with' : 'Answered in another window');
      const t = () => {
        const s = Math.max(0, Math.round(Date.now() / 1000 - (st.since || 0)));
        $('callTime').textContent = live ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : '';
      };
      t(); if (live) clock = setInterval(t, 1000);
    }

    function connect(){
      ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/phone?t=${T}`);
      ws.binaryType = 'arraybuffer';
      ws.onmessage = e => {
        if (typeof e.data !== 'string') {
          if (!play || !ctx) return;
          const pcm = new Int16Array(e.data), f = new Float32Array(pcm.length);
          for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 0x8000;
          play.port.postMessage(resample(f, WIRE, ctx.sampleRate));
          return;
        }
        let m; try { m = JSON.parse(e.data); } catch (x) { return; }
        st = m;
        if (m.type !== 'live') { mine = false; muted = false; stopAudio(); }
        if (m.type === 'ringing') $('callErr').textContent = '';
        draw();
      };
      ws.onclose = () => { st = {type: 'idle'}; mine = false; stopAudio(); draw(); setTimeout(connect, 3000); };
    }

    $('callAnswer').onclick = async () => {
      $('callAnswer').disabled = true;
      try {
        await startAudio();
        mine = true;
        ws.send(JSON.stringify({type: 'answer'}));
      } catch (e) {
        // No microphone, or permission refused: the call cannot be taken here, so let it pass
        // through rather than leave the caller ringing out.
        stopAudio();
        $('callErr').textContent = 'Microphone not available';
        ws.send(JSON.stringify({type: 'decline'}));
      }
      $('callAnswer').disabled = false;
    };
    $('callDecline').onclick = () => ws && ws.send(JSON.stringify({type: 'decline'}));
    $('callHang').onclick = () => ws && ws.send(JSON.stringify({type: 'hangup'}));
    $('callMute').onclick = () => { muted = !muted; draw(); };

    // Open the microphone, listen ~1 s, release it. {ok} or {ok: false, why: 'blocked'|'none'}.
    // 'blocked' also covers the silent refusal: every sample exactly zero.
    async function checkMic(){
      let s;
      try {
        s = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true}});
      } catch (e) {
        return {ok: false, why: (e && e.name === 'NotFoundError') ? 'none' : 'blocked'};
      }
      const c = audio();
      let peak = 0;
      try {
        if (c) {
          const n = c.createMediaStreamSource(s), an = c.createAnalyser(), g = c.createGain();
          an.fftSize = 2048; g.gain.value = 0;
          // Wired to the output through a muted gain: WebKit does not run a node that leads
          // nowhere, and an analyser that never runs reads zeros — the very thing checked for.
          n.connect(an).connect(g).connect(c.destination);
          const buf = new Float32Array(an.fftSize);
          for (let i = 0; i < 10; i++) {
            await new Promise(r => setTimeout(r, 100));
            an.getFloatTimeDomainData(buf);
            for (const v of buf) if (Math.abs(v) > peak) peak = Math.abs(v);
          }
          n.disconnect(); an.disconnect(); g.disconnect();
        }
      } finally {
        s.getTracks().forEach(t => t.stop());
      }
      if (ws && ws.readyState === 1)
        ws.send(JSON.stringify({type: 'diag', check: true, peak: Math.round(peak * 32767),
          ctx_state: c ? c.state : 'none'}));
      // No context to measure with is not evidence of a blocked microphone: permission was granted.
      if (!c || c.state !== 'running') return {ok: true};
      return peak > 0 ? {ok: true} : {ok: false, why: 'blocked'};
    }

    connect();
    return {state: () => st, checkMic};
  })();

  async function refresh(){
    THREADS = await fetch(`/api/threads?t=${T}`).then(r => r.json()).catch(() => ({people: []}));
  }

  // WHAT IS ON SCREEN, cheaply. Compared before and after a poll so a tick that changed nothing
  // redraws nothing: rebuilding innerHTML every few seconds throws away a text selection, and
  // the model panel already taught us what a needless re-render does to someone mid-read.
  // WHAT COUNTS AS A CHANGE WORTH REDRAWING FOR. Counting people, messages and calls missed
  // the one thing that arrives LATE: a transcript. It lands seconds to minutes after the call,
  // with the same person, the same timestamp and the same counts — so the signature did not
  // move, `drawWho` was never called, and the open thread went on saying "Transcript pending."
  // until the owner reloaded. That is the worst moment for it, because waiting for the
  // transcript is exactly when they are looking at that thread. Reported by Stanley
  // 2026-09-09, third instance of this shape in this file after chatSig and load().
  //
  // The transcript's LENGTH, not its text: this runs every five seconds and is compared as a
  // string, so it stays cheap. `files` moves too when the merge replaces two legs with one
  // stereo file, and the two "there is nothing to show" states can flip on their own.
  function callSig(c){
    return `${c.files}:${(c.transcript || '').length}:${c.norecording ? 'n' : ''}${
      c.silent ? 's' : ''}:${(c.suggest || {}).key || ''}`;
  }
  function threadSig(){
    return (THREADS.people || [])
      .map(p => `${p.who}:${p.last}:${(p.messages || []).length}:${
        (p.calls || []).map(callSig).join(',')}:${
        (p.messages || []).map(m => (m.suggest || {}).key || '').join(',')}`)
      .join('|');
  }

  // MESSAGES ARRIVE WHILE THE OWNER IS LOOKING AT THE PAGE. Without this they had to reload to
  // see one, which for a product whose whole point is conversing is the same as not receiving
  // it. Carried messages are not answered by anything, so nobody else is going to notice.
  // The same argument applies to the owner's OWN thread, and it did not until now. The chat
  // history was fetched once, at page load, from a time when the only way to add a turn was to
  // type it here. The owner can now ask their assistant from WhatsApp — and the answer went to
  // their phone while this panel kept showing the conversation as it stood when the page opened.
  function chatSig(){
    const last = TURNS[TURNS.length - 1] || {};
    return `${TURNS.length}:${last.q || ''}:${(last.a || '').length}:${last.pending ? 1 : 0}`;
  }
  async function refreshChat(){
    // NOT WHILE A LOCAL TURN IS IN FLIGHT. The pending bubble is drawn from state this poll
    // knows nothing about, so overwriting mid-send would drop the owner's own question off the
    // screen while they waited for its answer.
    if (BUSY) return;
    const hist = await fetch(`/api/chat_history?t=${T}`).then(r => r.json()).catch(() => null);
    if (!hist) return;
    const next = (hist.turns || []).map(t => t.break ? {brk: true}
      : {q: t.q, a: t.a, draft: !!t.draft, sent: !!t.sent, via: t.via || '', pending: !!t.pending, draft_for_name: t.draft_for_name || ''});
    const before = chatSig();
    TURNS = next;
    // Redraw only on a real change: rebuilding innerHTML every five seconds throws away a text
    // selection and jumps someone mid-read, which is what `threadSig` above exists to avoid.
    if (chatSig() !== before) drawChat();
  }

  setInterval(async () => {
    const before = threadSig();
    // `load()` TOO, not just the threads. Everything it draws can change while the
    // page sits open — the owner's name and number, the model in use, and the
    // channel state — and it ran ONCE at page load, so the sidebar kept whatever it
    // said when the tab opened. The number was the visible symptom (set in Settings,
    // still a dash in an already-open hub) and the channel was the dangerous one: a
    // dropped connection went on reading "Recording calls" until somebody reloaded.
    // One small fetch and a few idempotent writes; it rebuilds no lists, so nothing
    // the reader is looking at moves.
    await Promise.all([refresh(), refreshChat(), load()]);
    if (threadSig() !== before) drawWho();
  }, 5000);

  Promise.all([
    fetch(`/api/threads?t=${T}`).then(r => r.json()).catch(() => ({people: []})),
    fetch(`/api/chat_history?t=${T}`).then(r => r.json()).catch(() => ({turns: []})),
  ]).then(([th, hist]) => {
    THREADS = th;
    TURNS = (hist.turns || []).map(t => t.break ? {brk: true} : {q: t.q, a: t.a, draft: !!t.draft, sent: !!t.sent, via: t.via || '', pending: !!t.pending, draft_for_name: t.draft_for_name || ''});
    drawWho(true);
  });
  load();
</script>
</body>
</html>
