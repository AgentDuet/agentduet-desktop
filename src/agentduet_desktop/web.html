<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentDuet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .app{flex:1;display:flex;overflow:hidden;}
  aside{width:16rem;flex:0 0 16rem;background:var(--sidebar);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:1rem;gap:.9rem;overflow:hidden;}
  .prof{padding:.75rem;border-radius:.75rem;background:var(--slate900);
    border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:.75rem;
    flex-shrink:0;}
  .prof .av{width:2rem;height:2rem;flex:0 0 2rem;border-radius:50%;background:var(--accent);
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;
    font-size:.75rem;}
  .prof .n{font-size:.75rem;font-weight:600;color:var(--ink2);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .prof .p{font-size:10px;font-family:var(--mono);color:var(--emerald);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .navlab{font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:.05em;
    color:var(--faint);flex-shrink:0;}

  /* THE LEFT PANEL IS THE PEOPLE, not a menu. The four services moved into Settings, so the
     only thing this column does is say who called. */
  .who-list{display:flex;flex-direction:column;gap:.25rem;overflow-y:auto;flex:1;min-height:0;}
  .who{display:flex;flex-direction:column;gap:.15rem;padding:.6rem .7rem;border-radius:.6rem;
    background:transparent;border:1px solid transparent;cursor:pointer;transition:.12s;}
  .who:hover{background:rgba(255,255,255,.04);}
  .who.on{border-color:rgba(59,130,246,.4);background:rgba(37,99,235,.15);}
  .who .n{font-family:var(--mono);font-size:.78rem;color:var(--ink2);}
  .who .m{font-size:10px;color:var(--faint);}
  .who-empty{font-size:.75rem;color:var(--faint);padding:.5rem .2rem;}

  .store{padding:.625rem;border-radius:.5rem;background:var(--slate900);
    border:1px solid rgba(255,255,255,.05);font-size:11px;display:flex;flex-direction:column;
    gap:.25rem;flex-shrink:0;}
  .store .r{display:flex;justify-content:space-between;align-items:center;color:var(--muted);}
  .store a{color:var(--blue400);font-size:10px;text-decoration:none;}
  .store a:hover{text-decoration:underline;}
  .store .path{font-family:var(--mono);color:#cbd5e1;font-size:10px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}

  main{flex:1;min-width:0;background:var(--bg);display:flex;flex-direction:column;
    overflow:hidden;}
  .mbody{flex:1;overflow-y:auto;padding:0 1.5rem 1.5rem;}
  .thead{display:flex;justify-content:space-between;align-items:center;gap:1rem;
    padding:1.5rem 1.5rem 1.2rem;flex-shrink:0;}
  .thread{display:flex;flex-direction:column;gap:.6rem;}
  .call{background:var(--card);border:1px solid var(--line);border-radius:.75rem;
    padding:.9rem 1rem;display:flex;flex-direction:column;gap:.5rem;}
  .call .top{display:flex;justify-content:space-between;align-items:center;gap:1rem;}
  .call .when{font-size:.78rem;color:var(--ink2);font-weight:600;}
  .call .meta{font-family:var(--mono);font-size:10px;color:var(--faint);}
  .call .text{font-size:.8rem;color:#cbd5e1;line-height:1.6;white-space:pre-wrap;
    background:var(--slate900);border:1px solid rgba(255,255,255,.05);border-radius:.5rem;
    padding:.7rem;max-height:16rem;overflow:auto;}
  .call .none{font-size:.78rem;color:var(--faint);font-style:italic;}
  .blank{color:var(--faint);font-size:.85rem;}

  /* ---- the assistant --------------------------------------------------------------------
     TWO PANES, not three. It was briefly its own right-hand column, and at this window width
     that left the transcript at ~460px and the chat at ~320px — both too narrow, to buy a
     side-by-side view nobody asked for. As the pinned first row of the list it is one click
     away, always visible, and gets the whole main column when it is open. The person last
     opened is still sent as `viewing`, so "what did she want?" resolves after switching. */
  .who.pinned{flex-direction:row;align-items:center;gap:.55rem;margin-bottom:.35rem;
    padding-bottom:.7rem;border-bottom:1px solid var(--line);border-radius:.6rem .6rem 0 0;}
  .who.pinned .material-symbols-rounded{font-size:1.05rem;color:var(--blue400);}
  .who.pinned .n{font-family:var(--sans);font-weight:600;}
  .mdl{font-family:var(--mono);font-size:10px;color:var(--faint);padding:.2rem .5rem;
    border-radius:.3rem;background:var(--slate900);border:1px solid var(--line);}

  .chat{display:flex;flex-direction:column;gap:1.1rem;max-width:44rem;}
  .turn{display:flex;flex-direction:column;gap:.3rem;}
  /* A proposed knowledge write, waiting on the owner. Deliberately NOT a chat bubble: a
     bubble is something that was said, and this is something that has NOT happened yet. It
     is a control, so it looks like one. */
  .prop{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--blue400);
        border-radius:.5rem;padding:.75rem .875rem;margin:.5rem 0;}
  .prop b{display:block;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;
          color:var(--blue300);margin-bottom:.375rem;}
  .prop p{margin:0 0 .5rem;color:var(--ink2);font-size:.875rem;line-height:1.5;}
  .prop small{display:block;color:var(--faint);font-size:.75rem;margin-bottom:.625rem;}
  .prop .row{display:flex;gap:.5rem;justify-content:flex-start;}
  .prop button{background:transparent;border:1px solid var(--line);color:var(--muted);
               border-radius:.375rem;padding:.3rem .75rem;font:inherit;font-size:.8125rem;
               cursor:pointer;}
  .prop button:hover{border-color:var(--faint);color:var(--ink2);}
  .prop button.ok{background:var(--accent);border-color:var(--accent);color:#fff;}
  .prop button.ok:hover{filter:brightness(1.1);}
  .newconv{background:transparent;border:1px solid var(--line);color:var(--muted);
           border-radius:.375rem;padding:.25rem .625rem;font:inherit;font-size:.75rem;
           cursor:pointer;white-space:nowrap;}
  .newconv:hover{border-color:var(--faint);color:var(--ink2);}
  /* A divider, not a message: the record continues, the model's memory of it does not. */
  .brk{display:flex;align-items:center;gap:.625rem;margin:1rem 0;color:var(--faint);
       font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;}
  .brk::before,.brk::after{content:"";flex:1;height:1px;background:var(--line);}
  /* Who spoke, under the bubble. A reply the OWNER typed and one the agent produced look
     identical otherwise, and on a money or promise question that is the whole difference. */
  .turn .who{font-size:.6875rem;color:var(--faint);margin-top:.25rem;padding:0 .25rem;}
  .turn.me{align-items:flex-end;}
  .bub{padding:.65rem .85rem;border-radius:.85rem;font-size:.82rem;line-height:1.65;
    white-space:pre-wrap;overflow-wrap:anywhere;max-width:82%;}
  .turn.me .bub{background:rgba(37,99,235,.22);border:1px solid rgba(59,130,246,.35);
    color:var(--ink2);border-bottom-right-radius:.25rem;}
  .turn.it .bub{background:var(--card);border:1px solid var(--line);color:#cbd5e1;
    border-bottom-left-radius:.25rem;}
  .turn.bad .bub{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fca5a5;}
  .turn .row{display:flex;align-items:center;}
  .dots{display:flex;gap:.32rem;padding:.85rem;background:var(--card);border:1px solid var(--line);
    border-radius:.85rem;border-bottom-left-radius:.25rem;width:max-content;}
  .dots i{width:.35rem;height:.35rem;border-radius:50%;background:var(--faint);
    animation:blink 1.3s ease-in-out infinite;}
  .dots i:nth-child(2){animation-delay:.18s;}
  .dots i:nth-child(3){animation-delay:.36s;}
  .waited{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:.6rem;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){.dots i{animation:none;opacity:.6;}}

  .composer{display:flex;gap:.6rem;align-items:flex-end;padding:1rem 1.5rem;
    border-top:1px solid var(--line);background:var(--sidebar);flex-shrink:0;}
  .composer textarea{flex:1;min-height:2.5rem;max-height:9rem;resize:none;line-height:1.5;
    padding:.6rem .7rem;}
  .composer .btn{flex-shrink:0;padding:.55rem 1rem;}
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="lights">
      <i></i><i></i><i></i>
      <div class="brand"><div class="ad">AD</div><span>AgentDuet</span></div>
    </div>
    <div class="linebadge" id="lineBadge">
      <span class="dot"></span><span class="l">Power Mobile Line:</span>
      <span class="v" id="lineNum">—</span>
    </div>
    <a class="tbtn on" id="toSettings" href="#">
      <span class="material-symbols-rounded">settings</span><span>Settings</span></a>
  </div>

  <div class="app">
    <aside>
      <div class="prof">
        <div class="av" id="av">–</div>
        <div style="min-width:0;flex:1">
          <div class="n" id="who">—</div>
          <div class="p" id="phone">—</div>
        </div>
      </div>
      <div class="navlab">People</div>
      <div class="who-list" id="whoList"></div>
      <div class="store">
        <div class="r"><span id="chanState">—</span><a href="#" id="toSettings2">Settings</a></div>
      </div>
    </aside>

    <main>
      <div class="thead">
        <div>
          <h1 id="tTitle">Conversations</h1>
          <p class="sub" id="tSub">Everyone who has called you, and what was recorded.</p>
        </div>
        <div style="display:flex;gap:.6rem;align-items:center">
          <span class="mdl" id="aModel" hidden>—</span>
          <button class="newconv" id="newConv" hidden title="Start a new conversation. Your record is kept; the assistant stops carrying the earlier messages.">New conversation</button>
          <span class="pill" id="ovPill"><span class="dot"></span>…</span>
        </div>
      </div>
      <div class="mbody" id="mbody">
        <div class="thread" id="thread"></div>
      </div>
      <div class="composer" id="composer" hidden>
        <textarea id="ask" rows="1" placeholder="Ask about your calls…"></textarea>
        <button class="btn" id="send">Send</button>
      </div>
    </main>
  </div>
</div>

<script>
  window.onerror = function (m, src, line, col) {
    try { new Image().src = '/__jserr?m=' + encodeURIComponent(m) + '&line=' + line; } catch (e) {}
  };

  (function nativeChrome(){
    const mark = () => document.documentElement.classList.add('native');
    // TWO NATIVE HOSTS NOW. pywebview injects `window.pywebview`; the Swift shell
    // injects `window.agentduetNative` at document start. Either means macOS is
    // drawing the real traffic lights, so ours must not be drawn under them.
    if (window.pywebview || window.agentduetNative) mark();
    window.addEventListener('pywebviewready', mark);
  })();

  const T = new URLSearchParams(location.search).get('t') || '';
  const $ = id => document.getElementById(id);
  const esc = s => (s || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB'
                               : Math.max(1, Math.round(n / 1024)) + ' KB';
  const when = iso => {
    if (!iso) return '';
    const d = new Date(iso.replace(' ', 'T'));
    return isNaN(d) ? iso : d.toLocaleString(undefined,
      {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
  };
  const post = (path, body) => fetch(`${path}?t=${T}`, {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}).then(r => r.json());

  const toSettings = e => { e.preventDefault(); location.href = '/settings?t=' + T; };
  $('toSettings').onclick = toSettings;
  $('toSettings2').onclick = toSettings;

  //: Not a person — nobody called from it — so it is pinned above the list rather than
  //: sorted into it, and cannot be pushed down by whoever called most recently.
  const ASSISTANT = '__assistant__';
  let THREADS = {people: []}, PICKED = ASSISTANT, LAST_PERSON = '', MODEL = {};

  // ---- people and their calls ---------------------------------------------------------
  // Calls AND messages now, so the line cannot just say "n calls" — someone who only ever
  // wrote would have read as "0 calls".
  function countLabel(p){
    const c = (p.calls || []).length, m = (p.messages || []).length, bits = [];
    if (c) bits.push(c + ' call' + (c === 1 ? '' : 's'));
    if (m) bits.push(m + ' message' + (m === 1 ? '' : 's'));
    return bits.join(' · ') || 'no activity';
  }

  function drawWho(){
    const list = THREADS.people || [];
    if (PICKED !== ASSISTANT && !list.some(p => p.who === PICKED)) PICKED = ASSISTANT;
    $('whoList').innerHTML = `
      <div class="who pinned ${PICKED === ASSISTANT ? 'on' : ''}" data-who="${ASSISTANT}">
        <span class="material-symbols-rounded">smart_toy</span>
        <span class="n">Personal Assistant</span></div>`
      + (list.length ? list.map(p => `
      <div class="who ${p.who === PICKED ? 'on' : ''}" data-who="${esc(p.who)}">
        <span class="n">${esc(p.display || p.who)}</span>
        <span class="m">${countLabel(p)} · ${esc(when(p.last))}</span>
      </div>`).join('')
      : '<div class="who-empty">Nobody yet.</div>');
    $('whoList').querySelectorAll('.who').forEach(el => {
      el.onclick = () => {
        PICKED = el.dataset.who;
        if (PICKED !== ASSISTANT) LAST_PERSON = PICKED;
        drawWho();
      };
    });
    if (PICKED === ASSISTANT) drawAssistant(); else drawThread();
  }

  function drawAssistant(){
    $('tTitle').textContent = 'Personal Assistant';
    $('tSub').textContent = '';
    $('composer').hidden = false;
    $('aModel').hidden = false;
    $('newConv').hidden = false;
    const ok = !!MODEL.configured;
    $('ask').disabled = !ok;
    $('send').disabled = !ok;
    $('ask').placeholder = ok ? 'Ask about your calls…' : 'Attach a model in Settings';
    $('thread').innerHTML = '<div class="chat" id="chat"></div>';
    drawChat();
    if (ok) $('ask').focus();
  }

  function drawThread(){
    const p = (THREADS.people || []).find(x => x.who === PICKED);
    $('aModel').hidden = true;
    $('newConv').hidden = true;
    if (!p) { $('composer').hidden = true; return; }

    // THE COMPOSER IS THE POINT OF THIS VIEW. Messages are CARRIED now — the agent does not
    // answer them — so if the owner cannot reply from here, nobody replies at all.
    $('composer').hidden = false;
    $('ask').disabled = false;
    $('send').disabled = false;
    $('ask').placeholder = `Message ${p.display || p.who}…`;

    $('tTitle').textContent = p.display || p.who;
    const msgs = p.messages || [], calls = p.calls || [];
    const bits = [];
    if (calls.length) bits.push(`${calls.length} call${calls.length === 1 ? '' : 's'}`);
    if (msgs.length) bits.push(`${msgs.length} message${msgs.length === 1 ? '' : 's'}`);
    $('tSub').textContent = bits.join(' · ');

    // INTERLEAVED BY TIME, because they are one relationship and not two logs. Someone who
    // rang and then wrote is one person having one conversation across two channels.
    const items = calls.map(c => ({at: c.at, call: c}))
      .concat(msgs.map(m => ({at: m.at, msg: m})))
      .sort((x, y) => (x.at < y.at ? -1 : x.at > y.at ? 1 : 0));

    $('thread').innerHTML = items.map(it => it.call ? `
      <div class="call">
        <div class="top">
          <span class="when">${esc(when(it.call.at))}</span>
          <span class="meta">${esc(it.call.mode)}${it.call.files ? ' · ' + it.call.files + ' file' + (it.call.files === 1 ? '' : 's') : ''}${it.call.bytes ? ' · ' + kb(it.call.bytes) : ''}</span>
        </div>
        ${it.call.silent ? '<div class="none">No audio.</div>'
          : (it.call.transcript ? `<div class="text">${esc(it.call.transcript)}</div>`
                                : '<div class="none">Transcript pending.</div>')}
      </div>` : msgHtml(it.msg)).join('')
      || '<div class="none">Nothing yet.</div>';
    $('mbody').scrollTop = $('mbody').scrollHeight;
  }

  // One inbound message and whatever went back. `by` says who spoke for us, which the reader
  // cannot infer: empty means nobody did — the normal case now that messages are carried.
  function msgHtml(m){
    const theirs = m.them ? `<div class="turn it"><div class="bub">${esc(m.them)}</div>
        <div class="who">${esc(m.network)} · ${esc(when(m.at))}</div></div>` : '';
    if (!m.us) return theirs;
    return theirs + `<div class="turn me"><div class="bub">${esc(m.us)}</div>
        <div class="who">${m.by === 'agent' ? 'answered by the agent' : 'you · ' + esc(when(m.at))}</div></div>`;
  }

  // ---- the assistant ------------------------------------------------------------------
  // Its history lives on the daemon (run/owner_chat.json), so a reload or a restart does not
  // look like the conversation never happened.
  let TURNS = [], BUSY = false;

  function drawChat(pending){
    const log = $('chat');
    if (!log) return;
    log.innerHTML = TURNS.map(t => t.brk ? `<div class="brk"><span>new conversation</span></div>` : `
      <div class="turn me"><div class="bub">${esc(t.q)}</div></div>
      <div class="turn ${t.bad ? 'bad' : 'it'}"><div class="bub">${esc(t.a)}</div></div>`).join('')
      + (pending ? `<div class="turn me"><div class="bub">${esc(pending)}</div></div>
         <div class="turn it"><div class="row"><div class="dots"><i></i><i></i><i></i></div>
         <span class="waited" id="waited"></span></div></div>` : '')
      + PROPOSALS.map(p => `
      <div class="prop">
        <b>Add to your shared notes</b>
        <p>${esc(p.args && (p.args.fact || p.args.new || p.args.old) || '')}</p>
        <small>${esc((p.args && p.args.file) || 'knowledge')} · proposed after reading a call</small>
        <div class="row">
          <button class="ok" data-pid="${esc(p.id)}" data-ok="1">Add it</button>
          <button data-pid="${esc(p.id)}">Discard</button>
        </div>
      </div>`).join('');
    $('mbody').scrollTop = $('mbody').scrollHeight;
  }

  // The assistant may write freely to a PERSON's notes, because those stay attributed. The
  // shared notes are what everyone is told, so once a call transcript is in the conversation
  // the write waits here for a click. Nothing is saved until one arrives.
  let PROPOSALS = [];
  async function decide(id, approve){
    const d = await post('/api/proposal', {id, approve});
    PROPOSALS = d.proposals || [];
    drawChat();
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.prop button');
    if (b) decide(b.dataset.pid, b.dataset.ok === '1');
  });

  async function send(){
    const box = $('ask'), text = box.value.trim();
    if (!text || BUSY) return;
    BUSY = true;
    box.value = ''; box.style.height = 'auto';
    $('send').disabled = true;
    drawChat(text);
    const began = Date.now();
    const tick = setInterval(() => {
      const el = $('waited');
      const secs = Math.round((Date.now() - began) / 1000);
      if (el && secs >= 3) el.textContent = secs + 's';
    }, 1000);
    try {
      if (PICKED !== ASSISTANT) {
        // A REPLY TO A PERSON, not a question to the assistant. Same box, and the difference
        // is which of them is on screen — so it must be impossible to get wrong: the assistant
        // never sends, and this never asks.
        await post('/api/send', {asker: PICKED, text});
        await refresh();
        drawThread();
        clearInterval(tick); BUSY = false; $('send').disabled = false; box.focus();
        return;
      }
      // `viewing` is whoever is open in the middle column, so "her" and "this person" resolve
      // to what the owner is looking at rather than being guessed.
      const d = await post('/api/chat', {message: text, viewing: LAST_PERSON});
      TURNS.push({q: text, a: d.reply || '', bad: !!d.error});
      PROPOSALS = d.proposals || [];
    } catch (e) {
      if (PICKED !== ASSISTANT) {
        clearInterval(tick); BUSY = false; $('send').disabled = false;
        alert('Could not send: ' + e);
        return;
      }
      TURNS.push({q: text, a: String(e), bad: true});
    }
    clearInterval(tick);
    BUSY = false;
    $('send').disabled = false;
    drawChat();
    box.focus();
  }

  $('newConv').onclick = async () => {
    const d = await post('/api/chat_new', {});
    TURNS = (d.turns || []).map(t => t.break ? {brk: true} : {q: t.q, a: t.a});
    PROPOSALS = [];
    drawChat();
    $('ask').focus();
  };

  $('send').onclick = send;
  $('ask').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $('ask').addEventListener('input', () => {           // grow to the text, up to the cap
    const b = $('ask');
    b.style.height = 'auto';
    b.style.height = Math.min(b.scrollHeight, 128) + 'px';
  });

  async function load(){
    const D = await fetch(`/api/panel?t=${T}`).then(r => r.json()).catch(() => ({}));
    $('who').textContent = D.name || 'Not signed in';
    $('av').textContent = (D.name || '?').split(/\s+/).map(w => w[0] || '')
      .join('').slice(0, 2).toUpperCase() || '–';
    $('phone').textContent = D.phone || '—';
    if (D.phone) { $('lineNum').textContent = D.phone; $('lineBadge').classList.add('on'); }

    const live = ['live', 'connecting', 'retrying'].indexOf(D.channel) >= 0;
    $('ovPill').className = 'pill' + (live ? '' : ' off');
    $('ovPill').innerHTML = '<span class="dot"></span>' + (live ? 'Listening' : 'Not connected');
    $('chanState').textContent = live ? 'Recording calls' : 'Not connected';

    // WHICH MODEL IS ANSWERING, in the pane that is answering. Without it the owner cannot
    // tell a local 135M model from a hosted one, and the two give very different replies.
    MODEL = D.model || {};
    $('aModel').textContent = MODEL.name || 'no model';
    $('aModel').title = MODEL.describe || '';
    // The gate is applied where the composer is drawn, not here — it belongs to the ASSISTANT
    // and not to a reply. Replying to a person needs no model at all, the same way carrying a
    // call needs none, and disabling the box on an install with no key would have left a
    // carried message with nobody able to answer it.
    if (PICKED === ASSISTANT) drawAssistant();
  }

  async function refresh(){
    THREADS = await fetch(`/api/threads?t=${T}`).then(r => r.json()).catch(() => ({people: []}));
  }

  Promise.all([
    fetch(`/api/threads?t=${T}`).then(r => r.json()).catch(() => ({people: []})),
    fetch(`/api/chat_history?t=${T}`).then(r => r.json()).catch(() => ({turns: []})),
  ]).then(([th, hist]) => {
    THREADS = th;
    TURNS = (hist.turns || []).map(t => t.break ? {brk: true} : {q: t.q, a: t.a});
    drawWho();
  });
  load();
</script>
</body>
</html>
