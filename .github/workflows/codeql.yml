# CodeQL, ADVANCED SETUP (2026-10-06) — because default setup could not analyse Swift.
#
# Default setup's Swift "autobuild" hung for 40+ minutes on the first run and blocked every later
# analysis, so it was cut back to Python and Actions, leaving the macOS shell unscanned. Here the
# shell is built the way macos-shell.yml builds it, which takes minutes. All three editions are
# built, because code behind `#if RECORDER` / `#if !RECORDER` / `#if AI_ONLY` is only analysed if
# it is compiled.
#
# Default setup must be OFF while this exists (repo › Settings › Code security): GitHub refuses to
# process an advanced configuration's results while default setup is on.
#
# Triage the same way as the first run (SRK79, B3Networks/security-grc#35): a real finding is
# fixed; a false positive is dismissed on the alert with the reason written down.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"      # weekly, so new queries reach code that has not changed

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write   # upload the results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
            os: ubuntu-latest
          - language: actions
            build-mode: none
            os: ubuntu-latest
          - language: swift
            build-mode: manual
            os: macos-26         # Apple silicon and the macOS 26 SDK, as macos-shell.yml
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the three shells (Swift)
        if: matrix.language == 'swift'
        working-directory: macos
        run: |
          swift build -c release
          swift build -c release -Xswiftc -DRECORDER --product AgentDuetShell --build-path .build-recorder
          swift build -c release -Xswiftc -DAI_ONLY --product AgentDuetShell --build-path .build-ai

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
