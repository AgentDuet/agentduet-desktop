# Build the desktop binaries on the OS they run on. PyInstaller cannot cross-compile, so a Mac
# build needs a Mac — that is the whole reason this workflow exists rather than a local script.
#
# Triggered by hand (or by a tag) rather than on every push: a build takes minutes and produces
# a 40 MB+ artifact nobody needs per commit.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false          # a Windows failure must not hide a working Mac build
      matrix:
        include:
          - os: macos-14        # Apple silicon
            name: macos-arm64
          - os: macos-13        # Intel — a colleague on an older Mac cannot run an arm64 build
            name: macos-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read        # GITHUB_TOKEN needs this to clone the SDK repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # the floor the SDK requires

      # The SDK is not on PyPI, so it cannot be a normal dependency. It is built from the
      # branch that has DDUET support. No PAT is needed: wss-sdk-python is in the SAME org and
      # its Actions access is set to "accessible from repositories in the organization", so
      # this repo's own GITHUB_TOKEN can read it. Replace all of this with `pip install
      # agentduet` the day it is published — that is the open release blocker.
      - name: Build the SDK from source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch feature/dduet-channel \
            https://x-access-token:${GH_TOKEN}@github.com/B3Networks/wss-sdk-python.git sdk
          pip install build
          python -m build --wheel --outdir wheels sdk

      - name: Install
        run: |
          pip install wheels/*.whl
          # Voice. A different org (AgentDuet) but PUBLIC, so no credentials. Without this the
          # binary starts fine and silently cannot answer calls: voice.available() catches the
          # ImportError and reports "voice not enabled", which reads as a config problem.
          pip install "git+https://github.com/AgentDuet/agentduet-adapters"
          pip install ".[qwen]" pyinstaller

      - name: Build the binary
        run: pyinstaller --noconfirm --distpath dist-bin packaging/dduet-desktop.spec

      # Proves the binary RUNS, not merely that it linked. PyInstaller happily produces a
      # binary that dies at first import because a lazy import was never collected — that has
      # bitten this project, so a build that cannot answer `status` is a failed build.
      - name: Smoke test
        env:
          DDUET_HOME: ${{ runner.temp }}/dduet-smoke
        run: ./dist-bin/dduet-desktop status

      # A .app is a DIRECTORY, and upload-artifact zips it without reliably preserving the
      # executable bit — the bundle then does nothing when double-clicked. A DMG keeps
      # permissions intact, and it is also the format a Mac user expects: open, drag across.
      - name: Package the app (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "DDuet Desktop" \
            -srcfolder "dist-bin/DDuet Desktop.app" \
            -ov -format UDZO "dduet-desktop-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dduet-desktop-${{ matrix.name }}
          # The DMG on macOS, the bare binary on Linux. Both paths are listed because a
          # per-OS `path` would need two upload steps for no gain.
          path: |
            dduet-desktop-${{ matrix.name }}.dmg
            dist-bin/dduet-desktop
          if-no-files-found: error
