# Build the desktop binaries on the OS they run on. PyInstaller cannot cross-compile, so a Mac
# build needs a Mac — that is the whole reason this workflow exists rather than a local script.
#
# Triggered by hand (or by a tag) rather than on every push: a build takes minutes and produces
# a 40 MB+ artifact nobody needs per commit.
name: build

on:
  workflow_dispatch:
    inputs:
      shell:
        description: "macOS window: native (the Swift shell, shipping) or pyinstaller (fallback)"
        type: choice
        options: [native, pyinstaller]
        default: native
      # THE RECORDER EDITION (src/agentduet_desktop/edition.py): the recorder with NO AI in it,
      # for a partner whose review treats transcription as AI. macOS only — it is a native app,
      # and it ships no HTML pages for another platform to show. A tag push leaves this empty,
      # which is the full edition: releases are unchanged.
      edition:
        description: "full (everything), recorder (calls only, no AI in it) or ai (AgentDuet AI: no line)"
        type: choice
        options: [full, recorder, ai]
        default: full
  # ONE RELEASE PER APP: the tag's prefix says which app it builds (see EDITION below).
  push:
    tags: ["v*", "recorder-v*", "ai-v*"]

jobs:
  build:
    strategy:
      fail-fast: false          # a Windows failure must not hide a working Mac build
      matrix:
        # THE PLATFORMS, and why each is what it is (the list itself is the expression below):
        #
        # macos-26, NOT macos-14, and the reason is the SDK rather than the hardware.
        # AgentDuetSTT calls SpeechAnalyzer/SpeechTranscriber, which are macOS 26 APIs. The
        # `@available(macOS 26.0, *)` guard in that code governs RUNTIME — it still has to
        # COMPILE, and macos-14 is Sonoma, whose SDK has no such symbols. The build failed
        # there with "cannot find SpeechTranscriber in scope" while succeeding on a developer
        # Mac running 26.6.2, which is exactly the shape of bug a CI runner exists to catch.
        # The deployment target stays macOS 13 (Package.swift), so the binary still runs on
        # older Macs and reports "needs macOS 26" rather than crashing.
        # NO INTEL MAC BUILD — removed 2026-08-04, deliberately.
        #
        # It was `macos-13`, which GitHub has retired, so the job never STARTED. A queued job
        # keeps its whole run open, so every build read as "still running" while the arm64 and
        # Linux binaries had been finished for ages — three runs were held open that way, and
        # the artifacts sat there looking unavailable.
        #
        # `timeout-minutes` cannot fix it: that limits execution, and this never executes. Only
        # a label that exists would, and rather than swap in `macos-15-intel` untested and risk
        # the same silent hang, Intel is dropped until someone actually needs it.
        #
        # Consequence to be honest about: a colleague on a pre-2020 Mac cannot run our build.
        # Check the chip before sending them anything.
        # WINDOWS, x86-64 ONLY — and that is forced rather than chosen. `pywhispercpp` ships
        # `win32` and `win_amd64` wheels and NO `win_arm64`, so a native ARM build has no
        # speech engine. An ARM machine runs the x64 binary under Prism emulation instead,
        # which is fine for function and useless for timing.
        #
        # Everything else the build needs is available here: llama-cpp-python has cp312
        # win_amd64 wheels on its own index (the `else` branch below already fetches from
        # there), and pywebview, wasmtime, the SDK and mcp are pure Python.
        #
        # macOS ONLY, for every app, since beta 7 (Stanley, 2026-10-03): Windows and Linux are
        # not built. The notes above are kept for the day they come back; the two entries are
        # {"os":"ubuntu-latest","name":"linux-x86_64"} and {"os":"windows-latest","name":"windows-x86_64"}.
        include:
          - os: macos-26
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    # BASH ON ALL THREE, or nothing here runs on Windows: GitHub defaults `run:` to PowerShell
    # there, and every step in this file is a bash script. Git Bash is preinstalled on the
    # Windows image, so this is a one-line fix rather than a rewrite of the job.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read        # GITHUB_TOKEN needs this to clone the SDK repo
    # JOB level, not step level, and that is load-bearing: a step's `if:` cannot read env the
    # step itself declares, so `if: env.APPLE_CERT_P12 != ''` only works when the value is
    # visible from up here. Signing is skipped whenever the secret is absent, which is every
    # build until the certificate lands and every build in a fork — those still produce a
    # working, unsigned DMG exactly as before.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      # THE OLDEST macOS WE SHIP FOR, given to everything compiled here (2026-10-06). Unset, a
      # source build targets the RUNNER's own macOS: b8's llama.cpp was built for macOS 26, so on
      # 14 and 15 the local models could not load while the app said it ran on 13. The same
      # number is LSMinimumSystemVersion (make-macos-app.sh), Package.swift's platform and the
      # lock's target (packaging/lock.sh); tests/test_rules.py keeps them one number, and
      # packaging/check-minos.py fails the build if any binary in the bundle needs newer.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # ONE NAME PER EDITION, used by every step below so the signing, DMG and notarization
      # path is shared rather than copied. `inputs.edition` is empty on a tag push → full.
      # FROM THE INPUT on a dispatch, FROM THE TAG'S PREFIX on a tag push (recorder-v…, ai-v…).
      EDITION: ${{ inputs.edition || (startsWith(github.ref_name, 'recorder-v') && 'recorder') || (startsWith(github.ref_name, 'ai-v') && 'ai') || 'full' }}
      APP_NAME: ${{ (inputs.edition == 'recorder' || startsWith(github.ref_name, 'recorder-v')) && 'AgentDuet Recorder' || (inputs.edition == 'ai' || startsWith(github.ref_name, 'ai-v')) && 'AgentDuet AI' || 'AgentDuet Desktop' }}
      ARTIFACT: ${{ (inputs.edition == 'recorder' || startsWith(github.ref_name, 'recorder-v')) && 'agentduet-recorder' || (inputs.edition == 'ai' || startsWith(github.ref_name, 'ai-v')) && 'agentduet-ai' || 'agentduet-desktop' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # the floor the SDK requires

      # The SDK comes from PyPI now (the 1.1.0b* line — see the pin below). It used to be a wheel
      # committed under vendor/, because the DDUET channel lived only on a branch of a PRIVATE
      # repo that CI cannot clone — a private repo's Actions "access" setting governs actions
      # and reusable workflows, not `git clone`. Dropping DDUET for WhatsApp removed the need
      # for that wheel, and with it the thing that stopped this repo being published at all.

      # THE RECORDER INSTALLS NO AI AT ALL — not a provider, not a speech engine, not a model
      # runtime. The spec leaves them out of the bundle regardless; not having them on the build
      # machine is the stronger claim, and the audit step below checks the result either way.
      # THE LOCK (requirements.txt, packaging/lock.sh) pins every version as pip CONSTRAINTS:
      # it fixes versions without installing anything, so the recorder still gets no AI, and two
      # builds of one commit ship the same libraries. Compiled for macOS on Apple silicon only.
      - name: Install (recorder)
        if: env.EDITION == 'recorder'
        env:
          PIP_CONSTRAINT: ${{ runner.os == 'macOS' && 'requirements.txt' || '' }}
        run: |
          pip install "agentduet>=1.1.0b1"
          pip install ".[ui]" pyinstaller

      - name: Install
        if: env.EDITION != 'recorder'
        env:
          PIP_CONSTRAINT: ${{ runner.os == 'macOS' && 'requirements.txt' || '' }}
        run: |
          # >=1.1.0b1, not >=1.0.0: the daemon imports SendDduetMessage at module level
          # and PyPI still serves 1.0.0 as latest, so the old pin built a binary whose
          # `run` died on an ImportError while `status` stayed perfectly healthy.
          pip install "agentduet>=1.1.0b1"
          # Voice. A different org (AgentDuet) but PUBLIC, so no credentials. Without this the
          # binary starts fine and silently cannot answer calls: voice.available() catches the
          # ImportError and reports "voice not enabled", which reads as a config problem.
          #
          # The [qwen] EXTRA is required, not optional polish: it pulls soxr + numpy, which the
          # adapter imports to resample call audio. Installing the bare package builds a binary
          # whose voice path dies on import — silently, because that same ImportError is caught.
          #
          # FROM THE LOCK'S OWN ADDRESS, commit included: pip treats the bare repo URL and the
          # lock's pinned one (…@<sha>) as two different packages and refuses to resolve.
          ADAPTERS="git+https://github.com/AgentDuet/agentduet-adapters"
          if [ -n "${PIP_CONSTRAINT:-}" ]; then
            ADAPTERS=$(sed -n 's/^agentduet-adapters @ //p' requirements.txt)
          fi
          pip install "agentduet-adapters[qwen] @ $ADAPTERS"
          # ALL THREE providers, because the model is config rather than code: the setup wizard
          # offers Gemini, Anthropic and Qwen, and it defaults to Gemini. A binary built with
          # only [qwen] fails on the first screen for anyone who takes the default.
          #
          # [stt] TOO, and it is worth ~157 MB of binary. Carrying a call was deliberately made
          # to need NO model key — cannot_answer() lets it run without one, setup lets the model
          # step be skipped — so the owner it serves is exactly the one with no credential. Left
          # out, that owner gets recordings and no transcripts, and the no-key path we built is
          # a claim rather than a feature. numpy is already here via the qwen adapter, so the
          # real additions are ctranslate2, onnxruntime, tokenizers and av.
          # [local] — llama_cpp, and it is fetched DIFFERENTLY PER PLATFORM. Left out entirely,
          # the binary looks healthy and reports that local models are "not in this build":
          # true, and not what we shipped.
          #
          # macOS BUILDS FROM SOURCE, because the prebuilt macOS arm64 wheels are CORRUPT.
          # Verified 2026-08-27 on 0.3.35, .34, .33 and .32 — every one fails its own CRC on
          # `lib/libggml-base.*.dylib`, so pip dies unpacking it. The Linux wheel from the same
          # index passes the identical check, which is what rules out our tooling. Retrying is
          # useless; it is not a flaky download.
          #
          # The cost is build minutes. The gains are worth more than they cost: nothing depends
          # on a third party's static hosting any more, and a source build on Apple Silicon
          # enables METAL, so local models use the GPU instead of only the CPU — which the
          # prebuilt cpu wheel could never do.
          #
          # Linux keeps the wheel: it is verified intact and saves the same minutes.
          if [ "$RUNNER_OS" = "macOS" ]; then
            CMAKE_ARGS="-DGGML_METAL=on -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" \
              pip install --no-binary=llama-cpp-python \
              "llama-cpp-python>=0.3"
          else
            pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
              "llama-cpp-python>=0.3"
          fi
          # [ui] ON macOS AND WINDOWS ONLY. pywebview gives the owner view a real WKWebView
          # window, and PyInstaller CAN collect the backend there because it is pyobjc — an
          # ordinary pip package. Proven on a Mac 2026-09-02: both the onefile binary and the
          # .app open a native window (the request user agent is bare AppleWebKit, with no
          # Chrome token, and the process is a front app with our bundle id).
          #
          # Linux is left out deliberately, and it is not an oversight: there the bindings are
          # system GTK/Qt libraries that do not bundle, so `webview.start()` raises and the run
          # falls back to the browser regardless. Shipping it there buys weight and no window,
          # and Linux is the platform that sets up in the console anyway.
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install ".[gemini,anthropic,qwen,stt,local]" pyinstaller
          else
            pip install ".[gemini,anthropic,qwen,stt,local,ui]" pyinstaller
          fi

      - name: Build the binary
        # AGENTDUET_EDITION is read by the spec; see the top of agentduet-desktop.spec.
        run: AGENTDUET_EDITION="$EDITION" pyinstaller --noconfirm --distpath dist-bin packaging/agentduet-desktop.spec

      # THE RECORDER'S SMOKE TEST. The full one below asserts providers, voice, the engine and
      # the decider — every one of which the recorder must NOT have. So it asserts what it must:
      # that it says it is the recorder, that the daemon boots, and that it reaches the internet
      # over TLS (the a9 lesson). With no model download to prove TLS with, the update check is
      # the real handshake: GitHub, over the same urllib path.
      - name: Smoke test (recorder)
        if: env.EDITION == 'recorder'
        env:
          AGENTDUET_HOME: ${{ runner.temp }}/recorder-smoke
        run: |
          BIN=./dist-bin/agentduet-desktop/agentduet-desktop
          "$BIN" status | tee status.txt
          grep -q "edition  : recorder" status.txt \
            || { echo "::error::the binary does not say it is the recorder"; exit 1; }
          if grep -qE "^  (model|providers|engine|decider|voice|tools) *:" status.txt; then
            echo "::error::the recorder reports an AI component"; exit 1
          fi
          "$BIN" run --headless --no-channel > run.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "Owner site: http" run.log 2>/dev/null && break
            sleep 1
          done
          grep -q "Owner site: http" run.log 2>/dev/null || {
            echo "::error::the daemon did not start — full output follows"; cat run.log; exit 1; }
          echo "daemon booted and bound the owner site"
          URL=$(cat "$AGENTDUET_HOME/run/site-url")
          BASE="${URL%%/?t=*}"; TOKEN="${URL##*t=}"
          curl -sf -X POST "$BASE/api/about/check?t=$TOKEN" | tee check.json
          "$BIN" stop || true
          if python3 -c "import json,sys; u=json.load(open('check.json'))['update']; \
              sys.exit(0 if u.get('reachable') is True else 1)"; then
            echo "TLS works: the recorder reached GitHub"
          elif grep -qiE "ssl|certificate verif|CERTIFICATE_VERIFY" run.log; then
            echo "::error::the frozen recorder cannot verify TLS — certifi is not packaged, or entry.py did not find cacert.pem"
            cat run.log; exit 1
          else
            # NOT A TLS FAILURE, so not this gate's to fail: GitHub rate-limits a shared runner's
            # address, which answers 403 after a handshake that worked.
            echo "::warning::GitHub did not answer the update check, for a reason other than TLS"
            grep -i "github" run.log || true
          fi

      # Proves the binary RUNS, not merely that it linked. PyInstaller happily produces a
      # binary that dies at first import because a lazy import was never collected — that has
      # bitten this project, so a build that cannot answer `status` is a failed build.
      #
      # It also asserts WHAT THE BUILD CAN DO. Everything optional in this package degrades to
      # a caught ImportError and a polite message, so a binary missing a provider or the voice
      # adapter looks healthy and fails later in someone else's hands. The first macOS build
      # passed this step while having no Gemini, no Anthropic and no working voice.
      - name: Smoke test
        if: env.EDITION != 'recorder'
        env:
          AGENTDUET_HOME: ${{ runner.temp }}/dduet-smoke
          # Presence-only check in voice.available(); never used to call anything. Without it
          # the step cannot tell "adapter missing" from "no key configured".
          DASHSCOPE_API_KEY: ci-smoke-test-not-a-real-key
        run: |
          # THE macOS PATH IS A DIRECTORY NOW. macOS builds --onedir (see the spec for why:
          # onefile unpacked 91 MB on every launch), so PyInstaller emits
          # dist-bin/agentduet-desktop/ holding the executable plus _internal/. Linux stays
          # onefile, where the same path IS the executable.
          BIN=./dist-bin/agentduet-desktop
          [ "$RUNNER_OS" = "macOS" ] && BIN=./dist-bin/agentduet-desktop/agentduet-desktop
          [ "$RUNNER_OS" = "Windows" ] && BIN=./dist-bin/agentduet-desktop.exe
          echo "smoke-testing $BIN"
          "$BIN" status | tee status.txt
          for p in gemini anthropic qwen; do
            grep -qE "providers:.*\b$p\b" status.txt \
              || { echo "::error::binary was built without the $p provider"; exit 1; }
          done
          grep -q "voice    : available" status.txt \
            || { echo "::error::binary cannot answer calls — check agentduet-adapters[qwen]"; exit 1; }
          # LOCAL MODELS. The engine is ctypes-loaded from a path computed at import, so a
          # binary missing its libraries imports llama_cpp fine and dies when a model is first
          # loaded — after the owner has downloaded gigabytes of weights.
          grep -q "engine   : available" status.txt \
            || { echo "::error::binary has no local model engine — check the [local] extra and the spec"; exit 1; }
          grep -q "decider  : available" status.txt \
            || { echo "::error::binary cannot run the decision model — check onnxruntime/tokenizers in [local]"; exit 1; }
          grep -q "search   : available" status.txt \
            || { echo "::error::binary cannot search — SQLite without the fts5 trigram index, or no llama.cpp"; exit 1; }
          # The window is the same shape of silent absence as the lines above: without pywebview
          # the owner view just opens in a browser, which reads as a design choice rather than a
          # dependency that never got installed. Not asserted on Linux, where browser IS correct.
          if [ "$RUNNER_OS" != "Linux" ]; then
            grep -q "window   : native" status.txt \
              || { echo "::error::no native window — check the [ui] extra"; exit 1; }
          fi

          # AND IT MUST ACTUALLY START. Everything above is `status`, which imports almost
          # nothing — so it stayed green through a build whose `run` was dead on arrival: the
          # daemon's own module-level `from agentduet import SendDduetMessage` raised ImportError
          # on a too-old SDK, and no assertion here touched it. A binary that cannot boot the
          # daemon is not a build worth signing, let alone shipping, and only running it knows.
          "$BIN" run --headless --no-channel > run.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q "Owner site: http" run.log 2>/dev/null && break
            sleep 1
          done
          grep -q "Owner site: http" run.log 2>/dev/null || {
            echo "::error::the daemon did not start — full output follows"; cat run.log; exit 1; }
          echo "daemon booted and bound the owner site"
          "$BIN" stop || true

          # AND IT MUST REACH THE INTERNET OVER TLS. This is the a9 assertion.
          #
          # Everything above it passed on a9 — every provider listed, voice available, the
          # daemon booted and bound — and that release could not open a single connection: a
          # frozen build carries its own OpenSSL whose compiled-in CA path points at the
          # machine that BUILT it, so `create_default_context()` loaded no roots and every
          # handshake failed to verify. It was signed, notarized, stapled and handed to a
          # tester. Booting proves imports; only a connection proves TLS.
          #
          # `models download` is the cheapest real handshake we have: same urllib path as
          # everything else, no credentials, and it dies instantly when the roots are missing.
          # The smallest model in the catalogue is 0.24 GB and the check does not need all of
          # it — bytes on disk are the proof, so it is stopped after a few seconds.
          # NO `timeout` HERE. It is GNU coreutils and a clean macOS runner does not have it —
          # this step's first version used it, the shell said "timeout: command not found", the
          # download never ran, and the gate then reported "the binary reached nothing". A false
          # failure that looked exactly like the defect it exists to catch. It passed on Linux,
          # and locally, because both had coreutils.
          #
          # Backgrounding it is better than a fixed wait anyway: the check is "did any real
          # bytes arrive over TLS", so it can stop the moment they have instead of pulling all
          # 240 MB.
          "$BIN" models download gemma-3-270m > tls.log 2>&1 &
          DL=$!
          ARRIVED=""
          for _ in $(seq 1 60); do
            if [ -n "$(find "$AGENTDUET_HOME/models" -type f -size +1M 2>/dev/null | head -1)" ]; then
              ARRIVED=yes; break
            fi
            kill -0 "$DL" 2>/dev/null || break      # it exited: either finished or failed
            sleep 1
          done
          kill "$DL" 2>/dev/null || true
          wait "$DL" 2>/dev/null || true
          cat tls.log
          if grep -qiE "ssl|certificate verif|CERTIFICATE_VERIFY" tls.log; then
            echo "::error::the frozen binary cannot verify TLS — certifi is not packaged, or entry.py did not find cacert.pem"
            exit 1
          fi
          if [ -z "$ARRIVED" ] && [ -z "$(find "$AGENTDUET_HOME/models" -type f -size +1M 2>/dev/null | head -1)" ]; then
            echo "::error::no bytes arrived over TLS — the binary reached nothing"
            exit 1
          fi
          echo "TLS works: the binary fetched real bytes from a public host"
          rm -rf "$AGENTDUET_HOME/models"

      # ---- the native shell: THE SHIPPING PATH since 2026-09-03 --------------------------------
      #
      # `!= 'pyinstaller'` RATHER THAN `== 'native'`, and this is the whole reason the flip is
      # more than a default. A workflow_dispatch input default does NOT apply to a `push` event,
      # and the release trigger IS a tag push — so `inputs.shell` is empty there. Written as
      # `== 'native'` the native steps would have been skipped on every release while the
      # default said otherwise, which is the failure that looks correct.
      #
      # It was opt-in until somebody had launched it on a real Mac. That happened 2026-09-02:
      # menu bar item, no Dock icon, survives the window closing, starts its own daemon, signs
      # as an assembled bundle. pywebview remains the Windows and fallback path — hence the
      # explicit opt-out rather than removing the choice. It
      # replaces `dist-bin/AgentDuet Desktop.app` in place, so everything downstream — signing,
      # the DMG, notarization, stapling — runs on it unchanged rather than growing a parallel
      # path that drifts. `macos-shell.yml` is the fast compile check; this is how a tester
      # gets something to double-click.
      - name: Build the native shell (macOS)
        if: runner.os == 'macOS' && inputs.shell != 'pyinstaller'
        working-directory: macos
        run: |
          # THE RECORDER IS COMPILED WITHOUT ITS AI VIEWS (-D RECORDER), and only the shell is
          # built: the speech helper is the full edition's.
          if [ "$EDITION" = "recorder" ]; then
            swift build -c release -Xswiftc -warnings-as-errors -Xswiftc -DRECORDER --product AgentDuetShell
          elif [ "$EDITION" = "ai" ]; then
            # AgentDuet AI: no sign-in, no connection, its own name and instance (Edition.swift).
            swift build -c release -Xswiftc -warnings-as-errors -Xswiftc -DAI_ONLY
          else
            swift build -c release -Xswiftc -warnings-as-errors
          fi

      # THE LOCAL MODELS' SERVER (2026-10-09): llama.cpp's own llama-server, built from the commit
      # pinned in the script, and copied in by make-macos-app.sh. Not for the recorder, which runs
      # no model. See src/agentduet_desktop/llamaserver.py for why it replaced llama-cpp-python.
      - name: Build llama-server (macOS)
        if: runner.os == 'macOS' && inputs.shell != 'pyinstaller' && env.EDITION != 'recorder'
        run: packaging/build-llama-server.sh packaging/bin

      - name: Wrap it around the daemon (macOS)
        if: runner.os == 'macOS' && inputs.shell != 'pyinstaller'
        run: |
          # MOVE IT ASIDE FIRST. make-macos-app.sh removes <out>/AgentDuet Desktop.app before
          # writing, and since the onedir switch its INPUT is that same bundle — so passing
          # dist-bin as both would delete the daemon it is about to copy. Staging keeps the
          # final path unchanged, so signing, the DMG and notarization need no branch.
          # The PyInstaller bundle keeps its own fixed name; the app it becomes is named by the
          # edition (APP_NAME, read by make-macos-app.sh along with EDITION).
          mv "dist-bin/AgentDuet Desktop.app" "dist-bin/pyinstaller-stage.app"
          packaging/make-macos-app.sh \
            macos/.build/release/AgentDuetShell "dist-bin/pyinstaller-stage.app" dist-bin
          rm -rf "dist-bin/pyinstaller-stage.app"
          # THE .app, NOT dist-bin/agentduet-desktop. Since macOS went --onedir the daemon loads
          # Python from Contents/Frameworks, so it has to be assembled from the bundle
          # PyInstaller built; the COLLECT directory launches and then cannot find libpython.
          plutil -lint "dist-bin/$APP_NAME.app/Contents/Info.plist"

      # WHAT A PARTNER'S REVIEW WILL CHECK, checked first: the shipped bundle's modules,
      # libraries, data and the shell's strings, against edition.py's lists.
      - name: Audit the recorder (no AI in the bundle)
        if: runner.os == 'macOS' && env.EDITION == 'recorder'
        run: python packaging/audit-recorder.py "dist-bin/$APP_NAME.app"

      # THE LICENCES TRAVEL WITH THE APP (2026-10-06). MIT, BSD and Apache all ask that their
      # notice go with every copy, and the bundle carried ~90 packages and none of their texts.
      # THIRD-PARTY-NOTICES.txt is generated from what THIS build installed, so it is per edition
      # by construction: the recorder's lists no AI. The recorder also gets its own NOTICE, which
      # names no model. Before signing, so the files are sealed with the rest.
      - name: Include the licences (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install pip-licenses
          R="dist-bin/$APP_NAME.app/Contents/Resources"
          cp LICENSE "$R/LICENSE"
          if [ "$EDITION" = "recorder" ]; then cp packaging/NOTICE.recorder "$R/NOTICE"; else cp NOTICE "$R/NOTICE"; fi
          pip-licenses --with-license-file --no-license-path --with-notice-file --format=plain-vertical \
            --ignore-packages pip-licenses prettytable wcwidth pip setuptools wheel \
            --output-file "$R/THIRD-PARTY-NOTICES.txt"
          if [ -f "dist-bin/$APP_NAME.app/Contents/MacOS/llama-server" ]; then
            { echo; echo "----------------------------------------------------------------"; \
              cat packaging/bin/llama-server.LICENSES.txt; } >> "$R/THIRD-PARTY-NOTICES.txt"
          fi
          test -s "$R/THIRD-PARTY-NOTICES.txt"
          grep -c "^License" "$R/THIRD-PARTY-NOTICES.txt" || true

      # NOTHING IN THE BUNDLE MAY NEED A NEWER macOS THAN THE APP SAYS IT RUNS ON — the check
      # that b8 would have failed: llama.cpp built for 26 and numpy/onnxruntime for 14, in an app
      # that told macOS it ran on 13.
      - name: Check every binary runs on the app's minimum macOS
        if: runner.os == 'macOS'
        run: python packaging/check-minos.py "dist-bin/$APP_NAME.app"

      # ---- signing, and only when there is a certificate to sign with -----------------------

      - name: Import the signing certificate (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          # A DEDICATED keychain, thrown away with the runner. Importing into the login keychain
          # would leave the private key reachable by every later step in the job.
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$PASSWORD" build.keychain
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm cert.p12
          # WITHOUT THIS THE JOB HANGS rather than fails: codesign raises a GUI prompt for
          # keychain access that nobody can answer, and the step sits there until the timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain

      - name: Sign the app (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        run: |
          APP="dist-bin/$APP_NAME.app"
          # Ask the keychain which identity it holds instead of rebuilding its name from the team
          # id. The name embeds the legal entity ("Developer ID Application: B3 Networks Pte Ltd
          # (TEAMID)") and a rename would break the build for a reason nobody would guess. The
          # SHA-1 that comes back is accepted by codesign anywhere a name is.
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
                     | awk '/Developer ID Application/ {print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the keychain"; exit 1; }

          # INNER BINARIES FIRST, deepest last-modified-wins order. A bundle's signature covers
          # its contents, so signing the outer .app before its dylibs invalidates the outer one.
          # `--deep` looks like the shortcut for this and is deprecated by Apple precisely
          # because it applies the same entitlements to nested code that should not have them.
          # THROUGH THE RETRY WRAPPER, because --timestamp is a network call to Apple made once
          # per signature and ~140 of them in a burst gets throttled. That, and nothing else,
          # failed the 2026-09-18 build. See packaging/codesign-retry.sh.
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" -o -perm +111 \) -print0 \
            | xargs -0 -I{} packaging/codesign-retry.sh --force --options runtime --timestamp \
                --entitlements packaging/entitlements.plist --sign "$IDENTITY" {}

          packaging/codesign-retry.sh --force --options runtime --timestamp \
            --entitlements packaging/entitlements.plist --sign "$IDENTITY" "$APP"

          # --strict, because a signature that merely exists is not one Gatekeeper accepts.
          codesign --verify --deep --strict --verbose=2 "$APP"

      # A .app is a DIRECTORY, and upload-artifact zips it without reliably preserving the
      # executable bit — the bundle then does nothing when double-clicked. A DMG keeps
      # permissions intact, and it is also the format a Mac user expects: open, drag across.
      - name: Package the app (macOS)
        if: runner.os == 'macOS'
        run: |
          # SIZE IT EXPLICITLY, with room to spare. `hdiutil create -srcfolder` estimates the
          # volume from the source, and that estimate is too tight for a large .app: bundling
          # the speech engine took this from 58 MB to ~155 MB and the step began failing with
          # "No space left on device" — having already mounted the volume and started copying,
          # so it reads as a disk problem on the runner rather than an undersized image.
          APP="dist-bin/$APP_NAME.app"
          MB=$(du -sm "$APP" | cut -f1)
          # STAGE THE VOLUME, don't hand hdiutil the .app directly. A drag install needs somewhere to
          # drag TO: without an /Applications alias in the window, INSTALL.md's "drag AgentDuet Desktop to
          # your Applications folder" asks the owner to open a second Finder window and work out where it
          # goes. The alias is the affordance every Mac user already recognises.
          #
          # `ditto` rather than `cp -R` for the bundle: it preserves the extended attributes and the code
          # signature properly, which is the difference between a notarizable app and one that fails
          # verification for a reason the message will not name.
          STAGE=$(mktemp -d)
          ditto "$APP" "$STAGE/$APP_NAME.app"
          ln -s /Applications "$STAGE/Applications"
          echo "app is ${MB} MB; creating a $((MB + 200)) MB image"
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "$STAGE" -size $((MB + 200))m \
            -ov -format UDZO "$ARTIFACT-${{ matrix.name }}.dmg"
          rm -rf "$STAGE"

      # Notarization is Apple scanning the signed build and recording that it did. STAPLING is
      # the separate step that attaches the result to the file — without it the first launch
      # needs a working network to check, and a tester on a bad connection sees the warning we
      # paid to remove.
      - name: Notarize and staple (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          DMG="$ARTIFACT-${{ matrix.name }}.dmg"
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
                     | awk '/Developer ID Application/ {print $2; exit}')
          # The disk image is signed too. Notarization accepts it either way, but an unsigned
          # container around a signed app is a needless question mark for anyone who checks.
          packaging/codesign-retry.sh --force --timestamp --sign "$IDENTITY" "$DMG"

          echo "$APPLE_API_KEY_P8" | base64 --decode > key.p8
          trap 'rm -f key.p8' EXIT      # even if notarytool fails

          set +e
          xcrun notarytool submit "$DMG" \
            --key key.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m 2>&1 | tee notary.txt
          set -e

          # DO NOT TRUST THE EXIT CODE ALONE. `submit --wait` has returned 0 on a submission
          # that came back Invalid, so the only reliable signal is the status it printed.
          grep -q "status: Accepted" notary.txt || {
            ID=$(awk '/id: / {print $2; exit}' notary.txt)
            echo "::error::notarization was not accepted — full log follows"
            [ -n "$ID" ] && xcrun notarytool log "$ID" \
              --key key.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
            exit 1
          }

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # What a user's Mac will actually decide, asked the way Gatekeeper asks it.
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      # TWO STEPS, one per OS, and now there IS a gain in splitting them. This used to list both
      # paths in one step because neither cost anything extra. Since macOS went --onedir,
      # `dist-bin/agentduet-desktop` there is a 241 MB DIRECTORY rather than a file, so a shared
      # path would upload the whole unpacked tree alongside the DMG that already contains it.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ env.ARTIFACT }}-${{ matrix.name }}
          path: ${{ env.ARTIFACT }}-${{ matrix.name }}.dmg
          if-no-files-found: error

      # A GLOB, because Windows emits `agentduet-desktop.exe` and Linux `agentduet-desktop`.
      # Both are onefile (the spec only branches to onedir on darwin), so this stays one file
      # per platform rather than the 241 MB tree the macOS branch above exists to avoid.
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: agentduet-desktop-${{ matrix.name }}
          path: dist-bin/agentduet-desktop*
          if-no-files-found: error
