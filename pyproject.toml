[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentduet-desktop"
dynamic = ["version"]
description = "Records your calls, or answers them — on your own machine."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"   # the SDK requires 3.12
dependencies = [
  "agentduet>=1.0.0",        # released SDK: TELCO + WhatsApp
  "aiohttp>=3.9",            # the local owner site
  "python-dotenv>=1.0",      # reads $AGENTDUET_HOME/.env
  "pyyaml>=6.0",           # writing Goose's config.yaml — YAML needs a real parser
  "mcp>=1.0",                # the owner surface, for whatever AI app they already use
  # THE TOOL SANDBOX. Not optional and never was: wasm_host imports it at module level,
  # so without it `status` reports "tools: NOT available" and a customer-authored tool
  # cannot run at all. It was declared nowhere and installed by nobody, so every binary
  # shipped so far has had no sandbox — while the spec dutifully tried to collect its
  # native library and warned that customer tools would fail.
  "wasmtime>=25",
]

# One provider is required, none in particular — the model is config, not code.
[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]
qwen = ["httpx>=0.27"]        # DashScope's OpenAI-compatible endpoint
# Speech-to-text ON THIS MACHINE, for transcribing carried calls with no key and no network.
# Optional because it is ~430 MB installed and most of that is a CPU inference runtime — a
# cost worth choosing, not one to impose on an owner who only wants the agent to answer.
stt = ["faster-whisper>=1.0"]
# The owner's view in a native window rather than a browser tab. Optional on purpose: the site
# is the primary surface and must come up even where no system webview exists.
ui = ["pywebview>=5.0"]
# LOCAL MODELS, run from weights we download ourselves. This replaced Ollama on 2026-08-27:
# model management was free and cost the thing the product sells, which is that you download one
# binary and it works.
#
# INSTALLING THIS NEEDS AN EXTRA INDEX. llama-cpp-python publishes NO wheels on PyPI and builds
# from source, which would need a C++ toolchain on the owner's machine — the exact dependency
# this feature exists to remove. The maintainer's own index has prebuilt ones:
#
#   pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
#       "agentduet-desktop[local]"
#
# The native libraries total 7.7 MB, so the binary cost is small. They must be added to the
# PyInstaller spec BY HAND — `--collect-all` fails silently for exactly this shape, as wasmtime
# already taught us: the build succeeds and the binary dies at first use.
local = ["llama-cpp-python>=0.3"]

[project.scripts]
agentduet-desktop = "agentduet_desktop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Templates, examples and the served pages are DATA, not importable code.
[tool.setuptools.dynamic]
# One source of truth. Two declarations drift, and the one that drifts is the one nobody reads.
version = {attr = "agentduet_desktop.__version__"}

[tool.setuptools.package-data]
agentduet_desktop = ["*.html", "*.css", "templates/**/*", "examples/**/*", "prompts/**/*", "wasm/**/*"]
